<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Health</title>
<meta name="description" content="Private Garmin sleep and health analytics.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#123b33">
<link rel="icon" type="image/png" sizes="32x32" href="/desk-593457/assets/icon-32.png">
<link rel="apple-touch-icon" href="/desk-593457/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* same green-grain palette as the dashboard; this page is dark only (the dashboard is too) */
:root{
  --bg:oklch(0.2 0.04 178);--ink:oklch(0.97 0.025 90);--ink-2:oklch(0.97 0.025 90 / .66);--ink-3:oklch(0.97 0.025 90 / .4);
  --hair:oklch(0.97 0.025 90 / .12);--glass:oklch(1 0 0 / .055);--glass-r:oklch(1 0 0 / .11);--peach:oklch(0.8 0.1 48);
  /* sleep stages: one violet ramp, darker = deeper; awake = amber (not sleep) */
  --deep:oklch(0.52 0.16 285);--light:oklch(0.66 0.12 280);--rem:oklch(0.8 0.09 300);--awake:oklch(0.84 0.12 75);
  --line:oklch(0.86 0.1 60);--good:oklch(0.8 0.13 150);
  --sans:'Geist', ui-sans-serif, -apple-system, system-ui, sans-serif;--dot:'Doto', ui-monospace, monospace;
  --ease:cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{min-height:100dvh;color:var(--ink);font:15px/1.4 var(--sans);font-feature-settings:'tnum';
  background:radial-gradient(70% 50% at 50% 0%, oklch(0.32 0.07 172), transparent 70%),radial-gradient(60% 40% at 50% 100%, oklch(0.27 0.06 165), transparent 70%),var(--bg);
  padding:max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom))}
body::after{content:'';position:fixed;inset:0;z-index:100;background-image:var(--grain);background-size:150px;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dotnum{font-family:var(--dot);font-weight:900;letter-spacing:.02em;line-height:.9}

.app{max-width:1240px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 4px 4px}
.top h1{font:600 30px/1.1 var(--sans);letter-spacing:-.02em}
.top p{color:var(--ink-2);margin-top:6px}
.back{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:999px;color:var(--ink);text-decoration:none;
  background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-r);font-weight:500}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-r)}
.seg button{height:34px;padding:0 14px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:oklch(0.22 0.05 175)}
.ctl{display:flex;gap:10px;align-items:center}

.panel{background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-r);border-radius:24px;padding:20px;min-width:0;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font:500 17px/1.2 var(--sans);letter-spacing:-.01em}
.ph .aside{font-size:13px;color:var(--ink-2)}
.grid{display:grid;gap:16px}
@media (min-width:900px){ body{padding:28px 32px 40px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} }

/* last night */
.night{display:grid;gap:18px}
@media (min-width:900px){ .night{grid-template-columns:minmax(0,1fr) 320px;align-items:start} }
.hyp{position:relative;height:250px}
.hyp svg,.ch svg{display:block;width:100%;height:100%;overflow:visible}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:12px 14px;border-radius:18px;background:oklch(1 0 0 / .05);box-shadow:inset 0 0 0 1px var(--hair)}
.st .k{font:500 12px var(--sans);color:var(--ink-2)}
.st .v{font-size:28px;margin-top:6px;text-shadow:0 0 14px oklch(0.85 0.1 55 / .35)}
.st .v small{font:500 11px var(--sans);letter-spacing:0;color:var(--ink-2);margin-left:4px;text-shadow:none}
.st .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.split{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin-top:16px}
.split i{display:block;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend span::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink);font-weight:600}

/* averages */
.avgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){ .avgs{grid-template-columns:repeat(4,1fr)} }
.dv{font-size:12px;font-weight:600;margin-left:6px}
.dv.up{color:var(--good)} .dv.down{color:oklch(0.8 0.13 35)} .dv.flat{color:var(--ink-2)}

.ch{position:relative;height:220px}
.ch.tall{height:260px}
.ax{font:500 11px var(--sans);fill:var(--ink-3)}
.axl{font:500 12px var(--sans);fill:var(--ink-2)}
.gl{stroke:var(--ink);stroke-opacity:.09;stroke-width:1}
.goal{stroke:var(--ink);stroke-opacity:.45;stroke-width:1;stroke-dasharray:6 6}
.goal-t{font:500 11px var(--sans);fill:var(--ink-2)}
.dots{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-dasharray:0 8;stroke-linecap:round;opacity:.85}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--line);opacity:.12}
.bar{fill:var(--c,var(--line))}
.hit{fill:transparent}
.hl{stroke:var(--ink);stroke-opacity:.35;stroke-width:1}
.mk{fill:var(--line);stroke:oklch(0.24 0.05 178);stroke-width:2}
.empty{color:var(--ink-2);font-size:14px;padding:30px 0;text-align:center}

.tip{position:fixed;z-index:50;pointer-events:none;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.35;max-width:240px;
  background:oklch(0.16 0.03 178 / .94);box-shadow:inset 0 0 0 1px var(--glass-r),0 10px 30px -10px oklch(0 0 0 / .6);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip span{color:var(--ink-2)}

.acts{display:grid;gap:8px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:oklch(1 0 0 / .04)}
.act .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:oklch(1 0 0 / .08)}
.act .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act .t{font-weight:500}.act .s{font-size:12px;color:var(--ink-2)}
.act .m{font-size:13px;color:var(--ink-2);text-align:right}

details.tbl summary{cursor:pointer;color:var(--ink-2);font-size:14px}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--ink-2)}

.login{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
.login[hidden],.app[hidden]{display:none}
.login form{display:grid;gap:12px;width:min(320px,100%)}
.login input{height:50px;border-radius:14px;border:0;padding:0 16px;font:inherit;background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-r)}
.login button{height:50px;border-radius:999px;background:var(--ink);color:oklch(0.22 0.05 175);font-weight:500}
.login p{min-height:1.4em;font-size:13px;color:oklch(0.8 0.13 35);text-align:center}
.foot{color:var(--ink-3);font-size:12px;text-align:center;padding:8px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm"><label for="key">Owner key</label><input id="key" type="password" autocomplete="current-password"><button type="submit">Open</button><p id="lerr" role="alert"></p></form>
</div>

<main class="app" id="app">
  <header class="top">
    <div><h1>Health</h1><p id="sub">Garmin · loading…</p></div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Range" id="range"><button data-n="7" aria-pressed="false">7 days</button><button data-n="14" aria-pressed="true">14 days</button><button data-n="30" aria-pressed="false">30 days</button></div>
      <a class="back" id="back" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Day</a>
    </div>
  </header>

  <section class="panel" aria-labelledby="h-night">
    <div class="ph"><h2 id="h-night">Last night</h2><span class="aside" id="night-when"></span></div>
    <div class="night">
      <div>
        <div class="hyp" id="hyp" role="img" aria-label="Sleep stages through the night"></div>
        <div class="split" id="split" aria-hidden="true"></div>
        <div class="legend" id="nlegend"></div>
      </div>
      <div class="stats" id="nstats"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-avg">
    <div class="ph"><h2 id="h-avg">Averages</h2><span class="aside" id="avg-when"></span></div>
    <div class="avgs" id="avgs"></div>
  </section>

  <section class="panel" aria-labelledby="h-sleep">
    <div class="ph"><h2 id="h-sleep">Sleep per night</h2><span class="aside">dotted = sleep score</span></div>
    <div class="ch tall" id="c-sleep" role="img" aria-label="Sleep stages per night with score"></div>
    <div class="legend" id="slegend"></div>
  </section>

  <div class="grid g2">
    <section class="panel" aria-labelledby="h-sched">
      <div class="ph"><h2 id="h-sched">Bed and wake times</h2><span class="aside" id="sched-aside"></span></div>
      <div class="ch" id="c-sched" role="img" aria-label="Bedtime to wake time per night"></div>
    </section>
    <section class="panel" aria-labelledby="h-rhr">
      <div class="ph"><h2 id="h-rhr">Resting heart rate</h2><span class="aside">bpm · lower is fitter</span></div>
      <div class="ch" id="c-rhr" role="img" aria-label="Resting heart rate per day"></div>
    </section>
  </div>

  <div class="grid g3">
    <section class="panel" aria-labelledby="h-bb">
      <div class="ph"><h2 id="h-bb">Body Battery</h2><span class="aside">low to high</span></div>
      <div class="ch" id="c-bb" role="img" aria-label="Body Battery range per day"></div>
    </section>
    <section class="panel" aria-labelledby="h-stress">
      <div class="ph"><h2 id="h-stress">Stress</h2><span class="aside">daily average</span></div>
      <div class="ch" id="c-stress" role="img" aria-label="Average stress per day"></div>
    </section>
    <section class="panel" aria-labelledby="h-steps">
      <div class="ph"><h2 id="h-steps">Steps</h2><span class="aside" id="steps-aside"></span></div>
      <div class="ch" id="c-steps" role="img" aria-label="Steps per day against goal"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="h-acts">
    <div class="ph"><h2 id="h-acts">Activities</h2><span class="aside" id="acts-aside"></span></div>
    <div class="acts" id="acts"></div>
  </section>

  <section class="panel">
    <details class="tbl"><summary>All days as a table</summary><div class="tw" id="table"></div></details>
  </section>
  <p class="foot" id="foot">&nbsp;</p>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dur = m => m >= 60 ? `${Math.floor(m / 60)}h ${pad(Math.round(m) % 60)}m` : `${Math.round(m)}m`;
const hd = m => (m = Math.max(0, Math.round(m))) >= 60 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : `${m}m`;
const clock = ms => new Date(ms).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
const tshort = ms => { const d = new Date(ms), h = d.getHours(), m = d.getMinutes(); return `${(h % 12) || 12}${m ? ':' + pad(m) : ''}${h < 12 ? 'a' : 'p'}`; };
const dayLab = iso => new Date(iso + 'T12:00').toLocaleDateString('en-US', {weekday:'short', day:'numeric'});
const dayLong = iso => new Date(iso + 'T12:00').toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
const num = v => Math.round(v).toLocaleString();
const avg = a => { a = a.filter(v => v != null && isFinite(v)); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const STAGES = [['deep','Deep','var(--deep)'],['light','Light','var(--light)'],['rem','REM','var(--rem)'],['awake','Awake','var(--awake)']];
const LVH = [3, 2, 1, 0];  // Garmin levels 0 deep, 1 light, 2 REM, 3 awake -> height (deep highest, awake on the baseline)

(() => { try {  // film grain, same as the dashboard
  const c = document.createElement('canvas'); c.width = c.height = 150; const x = c.getContext('2d');
  const d = x.createImageData(150, 150); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
} catch {} })();

/* one tooltip for every chart: marks carry data-tip */
const tip = $('tip');
addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) return tip.classList.remove('on');
  tip.innerHTML = t.dataset.tip; tip.classList.add('on');
  const r = tip.getBoundingClientRect(), x = Math.min(innerWidth - r.width - 8, e.clientX + 14), y = e.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = (y < 8 ? e.clientY + 18 : y) + 'px';
  document.querySelectorAll('.hl.on').forEach(l => l.classList.remove('on'));
});
addEventListener('pointerleave', () => tip.classList.remove('on'));

let data = null, N = 14;
try { N = +localStorage.getItem('tj_health_n') || 14 } catch {}

const days = () => ((data.life || {}).health || {}).days || [];
const box = id => { const el = $(id); return {el, W: el.clientWidth, H: el.clientHeight}; };
const svg = (W, H, inner) => `<svg viewBox="0 0 ${W} ${H}">${inner}</svg>`;

/* x positions for a day series; bars get 2px surface gaps */
function xs(n, W, L, R){ const step = (W - L - R) / n; return {step, x: i => L + i * step, mid: i => L + (i + .5) * step, bw: Math.max(3, Math.min(34, step - 2 - step * .25))}; }
function yTicks(max, n = 4){ const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), s = [1, 2, 2.5, 5, 10].find(m => m * p >= raw) * p; return Array.from({length: n + 1}, (_, i) => i * s); }
function xLabels(list, X, H){ const every = Math.max(1, Math.ceil(46 / X.step)); return list.map((d, i) => (list.length - 1 - i) % every ? '' : `<text class="ax" x="${X.mid(i)}" y="${H - 4}" text-anchor="middle">${esc(dayLab(d.date))}</text>`).join(''); }

/* ---------- last night ---------- */
function renderNight(list){
  const n = [...list].reverse().find(d => d.sleep_s && d.start && d.end);
  if (!n) { $('hyp').innerHTML = '<p class="empty">No Garmin sleep yet. Wear the watch tonight.</p>'; $('nstats').innerHTML = ''; return; }
  $('night-when').textContent = `${dayLong(n.date)} · ${clock(n.start)} to ${clock(n.end)}`;
  const {el, W, H} = box('hyp'), L = 52, R = 8, T = 12, B = 26, span = n.end - n.start;
  const X = t => L + (t - n.start) / span * (W - L - R), step = (H - T - B) / 3, Y = lv => H - B - LVH[lv] * step;
  let o = '';
  STAGES.forEach(([, name], lv) => o += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(lv)}" y2="${Y(lv)}"/><text class="axl" x="0" y="${Y(lv) + 4}">${name}</text>`);
  for (let t = Math.ceil(n.start / 36e5) * 36e5; t < n.end; t += 36e5) { const x = X(t);
    if (x - L > 20 && W - R - x > 20 && new Date(t).getHours() % (W < 500 ? 2 : 1) === 0) o += `<text class="ax" x="${x}" y="${H - 4}" text-anchor="middle">${tshort(t)}</text>`; }
  const lv = n.levels || [];
  // soft band under each stage + the dotted step line (same style as the day line)
  let path = '';
  lv.forEach(([s, e, l], i) => { const x0 = X(s), x1 = X(e), y = Y(l);
    o += `<rect x="${x0}" y="${y}" width="${Math.max(1, x1 - x0)}" height="${H - B - y}" fill="${STAGES[l][2]}" opacity=".16"/>`;
    path += (i ? `H${x0.toFixed(1)}V${y}` : `M${x0.toFixed(1)} ${y}`) + `H${x1.toFixed(1)}`; });
  if (path) o += `<path class="dots" d="${path}"/>`;
  lv.forEach(([s, e, l]) => o += `<rect class="hit" x="${X(s)}" y="${T}" width="${Math.max(2, X(e) - X(s))}" height="${H - T - B}" data-tip="<b>${STAGES[l][1]}</b><span>${clock(s)} to ${clock(e)} · ${dur((e - s) / 6e4)}</span>"/>`);
  if (!lv.length) o += `<text class="axl" x="${(L + W) / 2}" y="${H / 2}" text-anchor="middle">Stage timeline arrives with the next sync</text>`;
  el.innerHTML = svg(W, H, o);

  const tot = STAGES.reduce((s, [k]) => s + (n[k + '_s'] || 0), 0) || 1;
  $('split').innerHTML = STAGES.map(([k,, c]) => `<i style="--c:${c};flex:${(n[k + '_s'] || 0) / tot} 1 0"></i>`).join('');
  $('nlegend').innerHTML = STAGES.map(([k, name, c]) => `<span style="--c:${c}">${name} <b>${dur((n[k + '_s'] || 0) / 60)}</b> ${Math.round((n[k + '_s'] || 0) / tot * 100)}%</span>`).join('');
  const deepPct = (n.deep_s || 0) / n.sleep_s * 100, remPct = (n.rem_s || 0) / n.sleep_s * 100;
  const st = (k, v, unit, sub) => `<div class="st"><div class="k">${k}</div><div class="v dotnum">${v}${unit ? `<small>${unit}</small>` : ''}</div><div class="sub">${sub}</div></div>`;
  $('nstats').innerHTML = [
    st('Asleep', hd(n.sleep_s / 60), '', `goal 8h · ${n.sleep_s / 60 >= 480 ? 'hit' : dur(480 - n.sleep_s / 60) + ' short'}`),
    st('Sleep score', n.sleep ?? '--', '', 'amount, stages, bedtime'),
    st('Deep', Math.round(deepPct), '%', deepPct >= 16 ? 'on target (16%+)' : 'target 16%+'),
    st('REM', Math.round(remPct), '%', remPct >= 21 ? 'on target (21%+)' : 'target 21%+'),
    n.rhr != null && st('Resting HR', n.rhr, 'bpm', 'today'),
    n.resp != null && st('Breathing', n.resp, 'brpm', 'average asleep'),
    n.bb_sleep != null && st('Recharge', '+' + n.bb_sleep, '', 'Body Battery overnight'),
    n.bb_high != null && st('Body Battery', n.bb != null ? n.bb : n.bb_high, '', `high ${n.bb_high ?? '--'} · low ${n.bb_low ?? '--'}`),
  ].filter(Boolean).join('');
}

/* ---------- averages vs the period before ---------- */
function renderAvgs(cur, prev){
  const rows = [['Sleep', d => d.sleep_s && d.sleep_s / 60, v => hd(v), true], ['Sleep score', d => d.sleep, v => Math.round(v), true],
    ['Resting HR', d => d.rhr, v => Math.round(v) + '<small>bpm</small>', false], ['Steps', d => d.steps, v => num(v), true]];
  $('avg-when').textContent = `last ${cur.length} days vs the ${cur.length} before`;
  $('avgs').innerHTML = rows.map(([k, f, fmt, upGood]) => { const a = avg(cur.map(f)), b = avg(prev.map(f));
    let dv = '';
    if (a != null && b != null && prev.filter(d => f(d) != null).length >= 3) { const diff = a - b, good = upGood ? diff > 0 : diff < 0, small = Math.abs(diff) < (k === 'Steps' ? 300 : k === 'Sleep' ? 10 : 1);
      dv = `<span class="dv ${small ? 'flat' : good ? 'up' : 'down'}">${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${k === 'Sleep' ? dur(Math.abs(diff)) : k === 'Steps' ? num(Math.abs(diff)) : Math.round(Math.abs(diff))}</span>`; }
    return `<div class="st"><div class="k">${k}</div><div class="v dotnum">${a == null ? '--' : fmt(a)}</div><div class="sub">avg${dv}</div></div>`; }).join('');
}

/* ---------- sleep per night: stacked stages + score dots ---------- */
function renderSleep(list){
  const {el, W, H} = box('c-sleep'), L = 34, R = 34, T = 14, B = 22;
  const nights = list.filter(d => d.sleep_s);
  if (!nights.length) { el.innerHTML = '<p class="empty">No nights yet.</p>'; return; }
  const max = Math.max(540, ...list.map(d => (d.sleep_s || 0) / 60 + (d.awake_s || 0) / 60)), ticks = yTicks(max / 60, 4).map(h => h * 60);
  const top = ticks[ticks.length - 1], Y = m => H - B - m / top * (H - T - B), X = xs(list.length, W, L, R);
  let o = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t / 60}h</text>`).join('');
  o += `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(480)}" y2="${Y(480)}"/><text class="goal-t" x="${W - R + 4}" y="${Y(480) + 4}">8h</text>`;
  const sc = [];
  list.forEach((d, i) => { if (!d.sleep_s) return; let acc = 0; const x = X.mid(i) - X.bw / 2, parts = [];
    for (const [k, name, c] of STAGES) { const m = (d[k + '_s'] || 0) / 60; if (!m) continue; parts.push([k, name, c, m, acc]); acc += m; }
    if (!parts.length) parts.push(['light', 'Asleep', 'var(--light)', d.sleep_s / 60, 0]), acc = d.sleep_s / 60;
    parts.forEach(([, , c, m, a], j) => { const y0 = Y(a), y1 = Y(a + m), h = Math.max(0, y0 - y1 - (j ? 2 : 0)), r = j === parts.length - 1 ? 4 : 0;
      o += r ? `<path class="bar" style="--c:${c}" d="M${x} ${y1 + h}V${y1 + r}q0 -${r} ${r} -${r}H${x + X.bw - r}q${r} 0 ${r} ${r}V${y1 + h}Z"/>` : `<rect class="bar" style="--c:${c}" x="${x}" y="${y1}" width="${X.bw}" height="${h}"/>`; });
    if (d.sleep != null) sc.push([X.mid(i), H - B - d.sleep / 100 * (H - T - B), i]);
    o += `<rect class="hit" x="${X.x(i)}" y="${T}" width="${X.step}" height="${H - T - B}" data-tip="<b>${esc(dayLong(d.date))}</b><span>${dur(d.sleep_s / 60)} asleep${d.sleep != null ? ` · score ${d.sleep}` : ''}<br>${parts.map(p => `${p[1]} ${dur(p[3])}`).join(' · ')}${d.start ? `<br>${clock(d.start)} to ${clock(d.end)}` : ''}</span>"/>`; });
  // score on its own 0-100 scale at the right edge, drawn as the dotted line (no second axis on the left)
  // dotted only between back-to-back nights, so a gap never reads as a trend
  const sd = sc.map((p, i) => (i && sc[i - 1][2] === p[2] - 1 ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  if (sc.length > 1) o += `<path class="dots" style="opacity:.6;pointer-events:none" d="${sd}"/>`;
  sc.forEach(p => o += `<circle class="mk" style="pointer-events:none" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`);
  o += xLabels(list, X, H);
  el.innerHTML = svg(W, H, o);
  $('slegend').innerHTML = STAGES.map(([, name, c]) => `<span style="--c:${c}">${name}</span>`).join('') + `<span style="--c:var(--line)">Score (0–100)</span>`;
}

/* ---------- bed + wake: a bar per night on a clock axis ---------- */
function renderSched(list){
  const {el, W, H} = box('c-sched'), L = 46, R = 8, T = 10, B = 22;
  const ns = list.filter(d => d.start && d.end);
  if (!ns.length) { el.innerHTML = '<p class="empty">No nights yet.</p>'; return; }
  // minutes after 6 PM on the evening before
  const m = ms => { const d = new Date(ms); return ((d.getHours() - 18 + 24) % 24) * 60 + d.getMinutes(); };
  const lo = Math.max(0, Math.floor((Math.min(...ns.map(d => m(d.start))) - 30) / 120) * 120), hi = Math.min(1440, Math.ceil((Math.max(...ns.map(d => m(d.end))) + 30) / 120) * 120);
  const Y = v => T + (v - lo) / (hi - lo) * (H - T - B), X = xs(list.length, W, L, R);
  let o = '';
  for (let v = lo; v <= hi; v += 120) { const h = (18 + v / 60) % 24; o += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${(h % 12) || 12}${h < 12 ? 'a' : 'p'}</text>`; }
  const beds = ns.map(d => m(d.start)).sort((a, b) => a - b), usual = beds[beds.length >> 1];
  list.forEach((d, i) => { if (!d.start) return; const y0 = Y(m(d.start)), y1 = Y(m(d.end)), off = Math.abs(m(d.start) - usual);
    o += `<rect class="bar" style="--c:${off > 60 ? 'var(--awake)' : 'var(--light)'}" x="${X.mid(i) - X.bw / 2}" y="${y0}" width="${X.bw}" height="${Math.max(2, y1 - y0)}" rx="4"/>`;
    o += `<rect class="hit" x="${X.x(i)}" y="${T}" width="${X.step}" height="${H - T - B}" data-tip="<b>${esc(dayLong(d.date))}</b><span>bed ${clock(d.start)} · up ${clock(d.end)}${off > 60 ? `<br>${dur(off)} off your usual bedtime` : ''}</span>"/>`; });
  const uh = (18 + usual / 60) % 24;
  o += `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(usual)}" y2="${Y(usual)}"/>`;
  o += xLabels(list, X, H);
  el.innerHTML = svg(W, H, o);
  $('sched-aside').textContent = `usual bedtime ${(Math.floor(uh) % 12) || 12}:${pad(Math.round(usual % 60))} ${uh < 12 ? 'AM' : 'PM'} · amber = 1h+ off`;
}

/* ---------- single-series line with a hover column per day ---------- */
function lineChart(id, list, f, fmt, name){
  const {el, W, H} = box(id), L = 34, R = 10, T = 12, B = 22, vals = list.map(f);
  const ok = vals.filter(v => v != null);
  if (ok.length < 1) { el.innerHTML = `<p class="empty">No ${name.toLowerCase()} yet.</p>`; return; }
  const mn = Math.floor((Math.min(...ok) - 3) / 5) * 5, mx = Math.ceil((Math.max(...ok) + 3) / 5) * 5;
  const Y = v => H - B - (v - mn) / (mx - mn) * (H - T - B), X = xs(list.length, W, L, R);
  let o = '';
  for (let v = mn; v <= mx; v += Math.max(5, Math.round((mx - mn) / 4 / 5) * 5)) o += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const pts = vals.map((v, i) => v == null ? null : [X.mid(i), Y(v)]), seg = [];
  pts.forEach(p => { if (p) seg.push(p); });
  if (seg.length > 1) { const d = seg.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    o += `<path class="ar" d="${d}L${seg[seg.length - 1][0]} ${H - B}L${seg[0][0]} ${H - B}Z"/><path class="ln" d="${d}"/>`; }
  pts.forEach((p, i) => { if (!p) return;
    o += `<circle class="mk" cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}"/>`;
    o += `<rect class="hit" x="${X.x(i)}" y="${T}" width="${X.step}" height="${H - T - B}" data-tip="<b>${esc(dayLong(list[i].date))}</b><span>${name} ${fmt(vals[i])}</span>"/>`; });
  const last = seg[seg.length - 1]; if (last) o += `<text class="axl" x="${Math.min(last[0], W - R - 30)}" y="${last[1] - 12}" text-anchor="middle">${fmt(ok[ok.length - 1])}</text>`;
  o += xLabels(list, X, H);
  el.innerHTML = svg(W, H, o);
}

/* ---------- bars (single series) with an optional goal line ---------- */
function barChart(id, list, f, fmt, name, goal, max0, c, rangeLo){
  const {el, W, H} = box(id), L = 38, R = 8, T = 12, B = 22, vals = list.map(f);
  if (!vals.some(v => v != null)) { el.innerHTML = `<p class="empty">No ${name.toLowerCase()} yet.</p>`; return; }
  const ticks = yTicks(Math.max(max0 || 0, goal || 0, ...vals.filter(v => v != null)) * 1.05, 4), top = ticks[ticks.length - 1];
  const Y = v => H - B - v / top * (H - T - B), X = xs(list.length, W, L, R);
  let o = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t >= 1000 ? t / 1000 + 'k' : t}</text>`).join('');
  if (goal) o += `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(goal)}" y2="${Y(goal)}"/>`;
  list.forEach((d, i) => { const v = vals[i]; if (v == null) return; const lo = rangeLo ? rangeLo(d) ?? 0 : 0, y = Y(v), y0 = Y(lo), x = X.mid(i) - X.bw / 2, r = Math.min(4, X.bw / 2);
    o += rangeLo ? `<rect class="bar" style="--c:${c}" x="${x}" y="${y}" width="${X.bw}" height="${Math.max(2, y0 - y)}" rx="${r}"/>`
      : `<path class="bar" style="--c:${c}" d="M${x} ${y0}V${Math.min(y0, y + r)}q0 -${r} ${r} -${r}H${x + X.bw - r}q${r} 0 ${r} ${r}V${y0}Z"/>`;
    o += `<rect class="hit" x="${X.x(i)}" y="${T}" width="${X.step}" height="${H - T - B}" data-tip="<b>${esc(dayLong(d.date))}</b><span>${name} ${fmt(v, d)}</span>"/>`; });
  o += xLabels(list, X, H);
  el.innerHTML = svg(W, H, o);
}

/* ---------- activities ---------- */
const ACT_ICON = {walk:'<path d="M13 4.5a1.5 1.5 0 1 1 0 .01M10 21l2-6 3 3v3M9 11l3-3 3 2 3 1M12 8l-1 5"/>', run:'<path d="M14 4.5a1.5 1.5 0 1 1 0 .01M6 20l4-4 2 1 2-5 4 3M9 11l3-3 3 1"/>',
  bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2 7"/>', swim:'<path d="M3 17c2 0 2-1.5 4.5-1.5S10 17 12 17s2-1.5 4.5-1.5S19 17 21 17M8 12l4-4 3 3M16 7.5a1.5 1.5 0 1 1 0 .01"/>',
  other:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'};
function renderActs(list){
  const acts = list.flatMap(d => (d.acts || []).map(a => ({...a, date: d.date}))).sort((a, b) => b.start - a.start);
  $('acts-aside').textContent = acts.length ? `${acts.length} in ${list.length} days · ${dur(acts.reduce((s, a) => s + a.sec / 60, 0))}` : '';
  $('acts').innerHTML = acts.slice(0, 12).map(a => { const t = a.type || 'activity', k = /run/.test(t) ? 'run' : /cycl|bik/.test(t) ? 'bike' : /swim/.test(t) ? 'swim' : /walk|hik/.test(t) ? 'walk' : 'other';
    return `<div class="act"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ACT_ICON[k]}</svg></span><div><div class="t">${esc(t.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()))}</div><div class="s">${esc(dayLong(a.date))} · ${clock(a.start)}</div></div><div class="m">${dur(a.sec / 60)}${a.km ? `<br>${a.km} km` : ''}</div></div>`; }).join('')
    || '<p class="empty">No recorded activities in this range.</p>';
}

/* ---------- table view ---------- */
function renderTable(list){
  const c = (v, f = x => x) => v == null ? '–' : f(v);
  $('table').innerHTML = `<table><thead><tr><th>Day</th><th>Asleep</th><th>Score</th><th>Deep</th><th>REM</th><th>Bed</th><th>Up</th><th>RHR</th><th>BB high/low</th><th>Stress</th><th>Steps</th></tr></thead><tbody>`
    + [...list].reverse().map(d => `<tr><td>${esc(dayLong(d.date))}</td><td>${c(d.sleep_s, v => dur(v / 60))}</td><td>${c(d.sleep)}</td><td>${c(d.deep_s, v => dur(v / 60))}</td><td>${c(d.rem_s, v => dur(v / 60))}</td><td>${c(d.start, clock)}</td><td>${c(d.end, clock)}</td><td>${c(d.rhr)}</td><td>${d.bb_high != null ? `${d.bb_high}/${d.bb_low ?? '–'}` : '–'}</td><td>${c(d.stress != null && d.stress >= 0 ? d.stress : null)}</td><td>${c(d.steps, num)}</td></tr>`).join('') + '</tbody></table>';
}

function render(){
  if (!data) return;
  const all = days().filter(d => d.date <= data.date);
  document.querySelectorAll('#range button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === N));
  const list = all.slice(-N), prev = all.slice(-2 * N, -N);
  const first = all.find(d => d.sleep_s || d.steps);
  $('sub').textContent = all.length ? `Garmin · ${first ? 'tracked since ' + dayLong(first.date) : 'waiting for the first sync'}` : 'Garmin · no data yet';
  renderNight(all);
  renderAvgs(list, prev);
  renderSleep(list);
  renderSched(list);
  lineChart('c-rhr', list, d => d.rhr, v => `${v} bpm`, 'Resting HR');
  barChart('c-bb', list, d => d.bb_high, (v, d) => `${d.bb_low ?? '–'} to ${v}`, 'Body Battery', null, 100, 'var(--good)', d => d.bb_low);
  barChart('c-stress', list, d => d.stress != null && d.stress >= 0 ? d.stress : null, (v, d) => `${v} avg${d.stress_max != null ? ` · peak ${d.stress_max}` : ''}`, 'Stress', 25, 50, 'var(--light)');
  const goal = avg(list.map(d => d.step_goal));
  barChart('c-steps', list, d => d.steps, (v, d) => `${num(v)}${d.step_goal ? ` of ${num(d.step_goal)}` : ''}`, 'Steps', goal, 0, 'var(--line)');
  $('steps-aside').textContent = goal ? `dashed = goal ${num(goal)}` : '';
  renderActs(list);
  renderTable(list);
  $('foot').textContent = `Updated ${data.updated || ''} · Garmin syncs every 30 min while the PC is on`;
}
document.querySelectorAll('#range button').forEach(b => b.onclick = () => { N = +b.dataset.n; try { localStorage.setItem('tj_health_n', N) } catch {}; render(); });
// redraw when a chart box changes width (first layout, font load, rotate, window resize)
let rz, lastW = 0; new ResizeObserver(() => { const w = $('app').clientWidth; if (w === lastW) return; lastW = w; clearTimeout(rz); rz = setTimeout(render, 80); }).observe($('app'));

/* ---------- data: same source + key as the dashboard ---------- */
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
$('back').href = LOCAL ? '/' : '/desk-593457';
const getKey = () => { try { return localStorage.getItem('tj_focus_key') } catch { return null } };
function showLogin(msg){ $('app').hidden = true; $('login').hidden = false; $('lerr').textContent = msg || ''; $('key').focus(); }
$('loginForm').onsubmit = e => { e.preventDefault(); try { localStorage.setItem('tj_focus_key', $('key').value) } catch {}; $('login').hidden = true; $('app').hidden = false; load(); };
async function load(){
  try {
    let r;
    if (LOCAL) r = await fetch('/api/today', {cache:'no-store'});
    else { const k = getKey(); if (!k) return showLogin();
      r = await fetch('/api/focus', {headers:{'x-key':k}, cache:'no-store'});
      if (r.status === 401) { try { localStorage.removeItem('tj_focus_key') } catch {}; return showLogin('That key didn’t work.'); } }
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); render();
  } catch (e) { $('foot').textContent = `Can’t reach the data (${e.message})`; }
}
load(); setInterval(() => document.visibilityState === 'visible' && load(), 120000);
</script>
