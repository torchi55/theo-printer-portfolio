<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Gate</title>
<meta name="description" content="Private productivity dashboard.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="theme-color" content="#f3dcd2">
<link rel="manifest" href="/desk-593457/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/desk-593457/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/desk-593457/assets/icon-192.png">
<link rel="apple-touch-icon" href="/desk-593457/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.925 0.008 230);
  --bg-2: oklch(0.965 0.005 230);
  --ink: oklch(0.22 0.015 250);
  --ink-2: oklch(0.45 0.015 250);     /* 6.5:1 on --bg-2 */
  --hair: oklch(0.22 0.015 250 / .12);
  --white: oklch(0.995 0 0);
  --sans: 'Geist', ui-sans-serif, -apple-system, system-ui, sans-serif;
  --dot: 'Doto', ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);     /* quint out */
  --fast: 220ms; --med: 520ms; --slow: 900ms;
  --z-bar: 10; --z-login: 30;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{min-height:100dvh;color:var(--ink);font:15px/1.4 var(--sans);font-feature-settings:'tnum';
  background:
    radial-gradient(60% 34% at 50% 0%, oklch(0.985 0.004 230) 0%, transparent 100%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 40%);
  padding:max(10px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dotnum{font-family:var(--dot);font-weight:900;letter-spacing:.02em;line-height:.9}

.app{max-width:440px;margin:0 auto;display:grid;gap:14px}
@media (min-width:960px){
  .app{max-width:1000px;grid-template-columns:440px 1fr;column-gap:28px;align-items:start}
  .col-a{position:sticky;top:16px}
  .sun,.tabs{grid-column:1}
}
.col-a,.col-b{display:grid;gap:14px;min-width:0}

/* ---------- top bar ---------- */
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:6px 0 2px}
.bar h1{text-align:center;font:500 17px/1.2 var(--sans);letter-spacing:-.01em}
.bar h1 small{display:block;font:400 12px var(--sans);color:var(--ink-2);margin-top:2px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--hair);
  transition:transform var(--fast) var(--ease),background var(--fast)}
.round:active{transform:scale(.92);background:oklch(1 0 0 / .5)}
.round svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.round.spin svg{animation:spin .9s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{position:relative}
.lock .shackle{transition:transform var(--med) var(--ease);transform-origin:16px 10px}
.lock.open .shackle{transform:translateY(-2px) rotate(28deg)}
.lock.open{background:var(--ink);color:var(--white);box-shadow:0 0 22px -4px oklch(0.75 0.16 55 / .9)}

/* ---------- today: the sun screen (weather-app inspired; warmth = life score) ---------- */
.sun{--s:0;position:relative;overflow:hidden;isolation:isolate;color:oklch(0.18 0.02 40);
  margin:calc(-1 * max(10px, env(safe-area-inset-top))) -16px 0;padding:calc(max(10px, env(safe-area-inset-top)) + 14px) 22px 18px;
  background:
    radial-gradient(70% 38% at 50% 46%, oklch(0.91 calc(0.08 + var(--s) * 0.11) calc(350 + var(--s) * 105) / .95), transparent 72%),
    radial-gradient(90% 40% at 50% 100%, oklch(0.76 calc(0.10 + var(--s) * 0.08) calc(10 + var(--s) * 38)), transparent 75%),
    linear-gradient(180deg, oklch(0.94 0.035 calc(10 + var(--s) * 25)) 0%, oklch(0.90 calc(0.06 + var(--s) * 0.06) calc(355 + var(--s) * 70)) 45%, oklch(0.80 calc(0.09 + var(--s) * 0.07) calc(20 + var(--s) * 30)) 100%);
  transition:--s var(--slow) var(--ease)}
@property --s{syntax:'<number>';inherits:true;initial-value:0}
.sun::after{content:'';position:absolute;inset:0;z-index:-1;background-image:var(--grain);background-size:150px;opacity:.12;mix-blend-mode:soft-light;pointer-events:none}
.sun-h h1{font:600 20px/1.15 var(--sans);letter-spacing:-.01em}
.sun-h h1 small{display:block;font-weight:600;color:oklch(0.18 0.02 40 / .42)}
.lifebig{text-align:center;font-size:96px;line-height:.9;margin:6px 0 2px;letter-spacing:.04em}
.sun-w{text-align:center;font:500 17px/1.25 var(--sans)}
.sun-w small{display:block;font-size:15px;color:oklch(0.18 0.02 40 / .45)}
.arc{position:relative;height:118px;margin:4px -22px 0}
.arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc .day{fill:none;stroke:oklch(0.18 0.02 40);stroke-width:1.6;stroke-linecap:round}
.arc .night{fill:none;stroke:oklch(0.18 0.02 40 / .55);stroke-width:2;stroke-linecap:round;stroke-dasharray:0 7}
.arc .hz{stroke:oklch(0.18 0.02 40 / .14);stroke-width:1}
.arc .pin{fill:oklch(0.18 0.02 40)}
.arc .stem{stroke:oklch(0.18 0.02 40);stroke-width:1.2}
.arc .halo{fill:oklch(1 0.03 90 / .35);stroke:oklch(0.18 0.02 40 / .12)}
.arc .ray{stroke:oklch(0.18 0.02 40);stroke-width:1.4;stroke-linecap:round}
.sun-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin-top:2px}
.sun-row b{display:block;font:500 21px/1.1 var(--sans);letter-spacing:-.01em}
.sun-row small{font-size:14px;color:oklch(0.18 0.02 40 / .45)}
.sun-row > div:last-child{text-align:right}
.sun-row .mid{text-align:center}
.sun-row .mid svg{display:block;width:28px;height:16px;margin:0 auto 4px}
.sun-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sc{position:relative;border-radius:22px;padding:13px 14px 12px;background:oklch(1 0.02 80 / .16);box-shadow:inset 0 0 0 1px oklch(1 0.02 80 / .28);min-height:168px;display:grid;grid-template-rows:auto auto 1fr auto}
.sc b{font:600 14px/1.2 var(--sans)}
.sc small{display:block;font:600 13px var(--sans);color:oklch(0.18 0.02 40 / .42)}
.sc .v{text-align:center;font-size:30px;margin-top:6px}
.wave{display:flex;align-items:center;justify-content:space-between;height:46px;margin-top:6px}
.wave i{width:2px;border-radius:1px;background:oklch(0.18 0.02 40 / .3);min-height:6px}
.wave i.on{background:oklch(0.18 0.02 40 / .75)}
.wave i.now{background:oklch(0.62 0.2 40);box-shadow:0 0 8px oklch(0.75 0.18 60);width:3px}
.scatter{position:relative;height:88px;margin-top:4px}
.scatter::before,.scatter::after{content:'';position:absolute;background:oklch(0.18 0.02 40 / .12)}
.scatter::before{left:0;right:0;top:50%;height:1px}
.scatter::after{top:0;bottom:0;left:50%;width:1px}
.scatter i{position:absolute;width:var(--z,7px);height:var(--z,7px);margin:calc(var(--z,7px) / -2);border-radius:50%;background:var(--c,oklch(0.18 0.02 40 / .35))}
.scatter i.meal{--z:13px;--c:oklch(0.93 0.17 100);box-shadow:0 0 10px oklch(0.95 0.18 100)}
.scatter i.meal.junk{--c:oklch(0.62 0.15 40)}
.scatter i.med{--z:11px;--c:oklch(0.62 0.13 300)}
.axis2{display:flex;justify-content:space-between;font:500 12px var(--sans);color:oklch(0.18 0.02 40 / .45);margin-top:4px}
.sun-foot{display:grid;grid-template-columns:48px 1fr 48px;align-items:end;margin-top:14px}
.sun-foot .round{width:48px;height:48px;box-shadow:inset 0 0 0 1px oklch(0.18 0.02 40 / .14);background:oklch(1 0.02 80 / .12)}
.dial{height:52px;position:relative}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial line{stroke:oklch(0.18 0.02 40 / .3);stroke-width:1.3;stroke-linecap:round}
.dial line.on{stroke:oklch(0.18 0.02 40)}
.dial circle{fill:oklch(0.86 0.18 95);stroke:oklch(0.18 0.02 40);stroke-width:1.2}
.dial text{font:700 9px var(--sans);fill:oklch(0.18 0.02 40);text-anchor:middle;dominant-baseline:central}
@media (min-width:960px){.sun{margin:0;border-radius:28px;padding:20px 22px 18px}}

/* ---------- metric tabs ---------- */
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:none;height:44px;padding:0 20px;border-radius:999px;font:500 15px var(--sans);color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--hair);transition:color var(--fast) var(--ease),box-shadow var(--fast)}
.tab[aria-selected=true]{color:var(--ink);box-shadow:none}
.tab:active{transform:scale(.97)}
.pill{position:absolute;z-index:0;top:2px;left:0;height:44px;border-radius:999px;background:var(--white);
  box-shadow:0 1px 2px oklch(0.2 0.02 250 / .08),0 6px 8px -6px oklch(0.2 0.02 250 / .14);
  transition:transform var(--med) var(--ease),width var(--med) var(--ease)}

/* ---------- hero chart card ---------- */
.hero{--h1:250;--h2:205;--h3:40;position:relative;overflow:hidden;border-radius:28px;color:var(--white);isolation:isolate;
  background:oklch(0.30 0.05 var(--h1));padding:22px 0 18px;
  transition:--h1 var(--slow) var(--ease),--h2 var(--slow) var(--ease),--h3 var(--slow) var(--ease)}
@property --h1{syntax:'<number>';inherits:true;initial-value:250}
@property --h2{syntax:'<number>';inherits:true;initial-value:205}
@property --h3{syntax:'<number>';inherits:true;initial-value:40}
.hero .glow{position:absolute;inset:-25%;z-index:-1;filter:blur(38px)}
.hero .glow i{position:absolute;border-radius:50%}
.hero .glow i:nth-child(1){width:70%;height:60%;left:0;top:-5%;background:oklch(0.30 0.07 var(--h1));animation:d1 16s ease-in-out infinite alternate}
.hero .glow i:nth-child(2){width:80%;height:55%;left:15%;bottom:0;background:oklch(0.66 0.11 var(--h2));animation:d2 19s ease-in-out infinite alternate}
.hero .glow i:nth-child(3){width:45%;height:45%;right:-2%;top:30%;background:oklch(0.62 0.16 var(--h3) / calc(.25 + var(--w,0) * .6));animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12%,8%) scale(1.1)}}
@keyframes d2{to{transform:translate(-10%,-6%) scale(.92)}}
@keyframes d3{to{transform:translate(-14%,10%) scale(1.15)}}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background-image:var(--grain);background-size:150px;opacity:.10;mix-blend-mode:overlay;pointer-events:none}
.hero-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 22px}
.hero-h h2{font:500 19px/1.2 var(--sans);letter-spacing:-.01em}
.hero-h h2 small{display:block;font:400 13px var(--sans);opacity:.72;margin-top:3px}
.hero-h .val{font-size:34px;text-shadow:0 0 14px oklch(1 0 0 / .45);text-align:right;white-space:nowrap}
.hero-h .val small{display:block;font:400 12px var(--sans);letter-spacing:0;opacity:.72;margin-top:6px}
.swap{transition:opacity var(--fast) var(--ease),filter var(--fast) var(--ease),transform var(--fast) var(--ease)}
.swap.out{opacity:0;filter:blur(6px);transform:translateY(4px)}

.chart{position:relative;height:168px;margin-top:6px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .area{fill:url(#ga)}
.chart .line{fill:none;stroke:var(--white);stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 4px oklch(1 0 0 / .55))}
.chart .goal{stroke:oklch(1 0 0 / .38);stroke-width:1;stroke-dasharray:2 4;transition:opacity var(--med) var(--ease)}
.chart .goal-t{position:absolute;left:22px;font:500 10px var(--sans);letter-spacing:.06em;opacity:.65;transform:translateY(-130%);transition:opacity var(--med),top var(--med) var(--ease)}
.knob{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.knob .stem{position:absolute;left:-.5px;top:0;width:1px;border-left:1px dotted oklch(1 0 0 / .6)}
.knob .o{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:oklch(1 0 0 / .16);box-shadow:inset 0 0 0 1px oklch(1 0 0 / .35);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.knob .o::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--white);box-shadow:0 0 10px var(--white)}
.days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;margin-top:8px}
.day{justify-self:center;width:38px;height:38px;border-radius:50%;font:500 12px var(--sans);color:oklch(1 0 0 / .78);
  box-shadow:inset 0 0 0 1px oklch(1 0 0 / .26);transition:background var(--fast) var(--ease),color var(--fast),box-shadow var(--fast),transform var(--fast) var(--ease)}
.day:active{transform:scale(.9)}
.day[aria-pressed=true]{background:var(--white);color:var(--ink);box-shadow:0 0 18px -2px oklch(1 0 0 / .7)}
.day{position:relative}
.day.hit:not([aria-pressed=true]){box-shadow:inset 0 0 0 1.5px oklch(0.85 0.13 70)}
.day[data-night]::after{content:'';position:absolute;left:50%;bottom:-9px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%}
.day[data-night=kept]::after{background:oklch(0.9 0.05 250);box-shadow:0 0 6px oklch(0.9 0.05 250)}
.day[data-night=late]::after{background:oklch(0.78 0.16 50);box-shadow:0 0 6px oklch(0.78 0.16 50)}
.day[data-night=pending]::after{box-shadow:inset 0 0 0 1px oklch(1 0 0 / .7)}
.range{text-align:center;font:400 13px var(--sans);opacity:.75;margin-top:14px}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{--c1:oklch(0.7 0.2 350);--c2:oklch(0.6 0.15 40);--c3:oklch(0.35 0.06 30);
  position:relative;overflow:hidden;isolation:isolate;min-height:112px;border-radius:30px;padding:14px 16px 14px;color:var(--white);text-align:left;
  display:grid;grid-template-rows:auto 1fr auto;background:var(--c3);
  box-shadow:0 14px 22px -16px var(--c2);transition:transform var(--fast) var(--ease),box-shadow var(--med) var(--ease)}
.t:active{transform:scale(.96)}
.t::before{content:'';position:absolute;inset:-30%;z-index:-1;filter:blur(18px);
  background:radial-gradient(45% 55% at 30% 30%, var(--c1), transparent 70%),radial-gradient(55% 60% at 75% 80%, var(--c2), transparent 72%),var(--c3)}
.t::after{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;box-shadow:inset 0 1px 0 oklch(1 0 0 / .25),inset 0 0 0 1px oklch(1 0 0 / .08)}
.t .k{font:500 12px var(--sans);text-align:center;opacity:.88}
.t .row{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;align-self:end}
.t .v{font-size:31px;text-shadow:0 0 12px oklch(1 0 0 / .5)}
.t .v small{font:400 11px var(--sans);letter-spacing:0;opacity:.8;margin-left:3px;text-shadow:none}
.t .b{flex:none;font:500 11px var(--sans);padding:3px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px oklch(1 0 0 / .45);white-space:nowrap}
.t > span{display:block;min-width:0}
.t .prog{display:block;height:2px;border-radius:2px;background:oklch(1 0 0 / .22);margin-top:10px;overflow:hidden}
.t .prog i{display:block;height:100%;background:var(--white);transform-origin:left;transform:scaleX(var(--f,0));transition:transform var(--slow) var(--ease);box-shadow:0 0 6px var(--white)}
.t.done{box-shadow:0 14px 26px -12px var(--c1)}
.t.done .b{background:var(--white);color:oklch(0.25 0.03 250);box-shadow:none}
.t.score{--c1:oklch(0.72 0.2 calc(300 + var(--s,0) * 60));--c2:oklch(0.70 0.17 calc(330 + var(--s,0) * 75));--c3:oklch(0.34 0.07 calc(320 + var(--s,0) * 40))}
.t.left{--c1:oklch(0.62 0.13 270);--c2:oklch(0.55 0.12 230);--c3:oklch(0.30 0.07 265)}
.t.med{--c1:oklch(0.72 0.13 300);--c2:oklch(0.60 0.14 270);--c3:oklch(0.33 0.07 290)}
.t.duo{--c1:oklch(0.80 0.19 130);--c2:oklch(0.62 0.15 160);--c3:oklch(0.33 0.07 150)}
.t.sleep{--c1:oklch(0.66 0.13 285);--c2:oklch(0.50 0.12 250);--c3:oklch(0.24 0.06 270)}
.t.off{filter:saturate(.25);opacity:.75}

.t.now{color:var(--ink);background:var(--white);box-shadow:0 1px 2px oklch(0.2 0.02 250 / .06),0 10px 18px -14px oklch(0.2 0.02 250 / .3)}
.t.now::before,.t.now::after{display:none}
.t.now .k{color:var(--ink-2)}
.t .np{display:flex;align-items:center;gap:10px;min-width:0;align-self:end}
.np .tx{min-width:0;flex:1}
.np .tt,.np .ar{display:block}
.np .tt{font:500 13px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ar{font:400 12px var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc{flex:none;width:42px;height:42px;border-radius:12px;position:relative;background-size:cover;background-position:center;
  background-color:oklch(0.85 0.02 250);box-shadow:0 0 0 1px var(--hair)}
.disc.gen::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--white);box-shadow:0 0 0 1px var(--hair)}
.disc.gen,.playing .disc{border-radius:50%}
.disc.gen{background-image:conic-gradient(from var(--a,0deg),var(--d1),var(--d2),var(--d1))}
.playing .disc{animation:rot 5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-right:5px;vertical-align:-1px}
.eq i{width:2px;background:oklch(0.62 0.18 145);border-radius:1px;height:40%;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{to{height:100%}}

/* ---------- light panels ---------- */
.panel{background:oklch(0.985 0.003 230 / .82);border-radius:24px;padding:18px 18px 16px;box-shadow:0 1px 2px oklch(0.2 0.02 250 / .05)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ph h2{font:500 17px/1.2 var(--sans);letter-spacing:-.01em}
.ph .aside{font:400 13px var(--sans);color:var(--ink-2)}

.mix{display:flex;gap:3px;height:44px}
.mix i{display:block;height:100%;border-radius:12px;background:var(--c);min-width:6px;transform-origin:left;position:relative;overflow:hidden}
.mix i::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,oklch(1 0 0 / .28),transparent 60%)}
.mix i.sel{box-shadow:0 0 0 2px var(--white),0 0 0 3.5px var(--c)}
.cats{display:grid;gap:2px;margin-top:12px}
.cat{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-radius:10px;transition:background var(--fast)}
.cat .sw{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.cat .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .n span{color:var(--ink-2);font-size:12px;margin-left:4px}
.cat .m{font-size:13px;color:var(--ink-2)}
.cat.neg .n{color:oklch(0.48 0.17 27)}
.cat.sel{background:oklch(0.22 0.015 250 / .05)}
.more{margin-top:6px;font:500 13px var(--sans);color:var(--ink-2);padding:8px 2px}

.seg{display:inline-flex;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{height:30px;padding:0 12px;border-radius:999px;font:500 12px var(--sans);color:var(--ink-2);transition:background var(--fast),color var(--fast)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--white)}
.tracks{display:grid}
.track{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:8px 0}
.track + .track{border-top:1px solid var(--hair)}
.track .tt{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .ar{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .m{font-size:12px;color:var(--ink-2);white-space:nowrap}
.track > div{min-width:0}
.empty{color:var(--ink-2);font-size:14px;padding:6px 0}

/* ---------- day: bedtime, 24h strip, classes, windows ---------- */
.batt{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--sans);color:var(--ink-2)}
.batt svg{width:24px;height:12px;overflow:visible}
.batt rect.f{fill:var(--bc,var(--ink))}
.bed{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;margin-bottom:16px;color:var(--white);
  background:radial-gradient(80% 140% at 0% 0%, oklch(0.42 0.10 285), transparent 70%),radial-gradient(70% 120% at 100% 100%, oklch(0.40 0.09 245), transparent 70%),oklch(0.26 0.05 270)}
.bed svg{flex:none;width:26px;height:26px;fill:oklch(0.92 0.06 90);filter:drop-shadow(0 0 6px oklch(0.92 0.06 90 / .7))}
.bed .bt{font:500 15px/1.25 var(--sans)}
.bed .bs{font:400 12px var(--sans);opacity:.75;margin-top:2px}
.bed .cd{margin-left:auto;font-size:24px;text-shadow:0 0 10px oklch(1 0 0 / .45);white-space:nowrap}
.bed.soon{background:radial-gradient(80% 140% at 0% 0%, oklch(0.55 0.15 40), transparent 70%),radial-gradient(70% 120% at 100% 100%, oklch(0.40 0.12 330), transparent 70%),oklch(0.28 0.06 320)}
.bed.off{color:var(--ink);background:oklch(0.22 0.015 250 / .05)}
.bed.off svg{fill:var(--ink-2);filter:none}
.strip-w{position:relative;margin:4px 0 0}
.strip{position:relative;display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:64px;align-items:end}
.strip .h{display:flex;flex-direction:column-reverse;height:100%;border-radius:4px;overflow:hidden;background:oklch(0.22 0.015 250 / .05)}
.strip .h i{display:block;background:var(--c);flex:none}
.strip .h.future{background:oklch(0.22 0.015 250 / .025)}
.tick{position:absolute;top:-6px;bottom:-4px;width:0;border-left:1.5px solid var(--ink);pointer-events:none}
.tick span{position:absolute;top:-16px;left:0;transform:translateX(-50%);font:500 10px var(--sans);white-space:nowrap;color:var(--ink)}
.tick.bt{border-left:1.5px dashed oklch(0.45 0.12 285)}
.tick.bt span{color:oklch(0.45 0.12 285)}
.classes-row{position:relative;height:8px;margin-top:6px}
.classes-row i{position:absolute;top:0;height:100%;border-radius:4px;background:oklch(0.45 0.12 285 / .35)}
.classes-row i.cur{background:oklch(0.45 0.12 285)}
.axis{display:flex;justify-content:space-between;margin-top:6px;font:400 11px var(--sans);color:var(--ink-2)}
.sub-h{font:500 13px var(--sans);color:var(--ink-2);margin:18px 0 6px}
.cls{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:8px 10px;margin:0 -10px;border-radius:12px;font-size:14px}
.cls .tm{font-size:13px;color:var(--ink-2);white-space:nowrap}
.cls .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls .wh{font-size:12px;color:var(--ink-2)}
.cls.past{opacity:.45}
.cls.cur{background:oklch(0.45 0.12 285 / .1)}
.cls.cur .nm::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:oklch(0.5 0.15 285);margin-right:8px;vertical-align:1px;animation:ping2 2s var(--ease) infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 oklch(0.5 0.15 285 / .5)}80%,100%{box-shadow:0 0 0 6px oklch(0.5 0.15 285 / 0)}}
.win{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.win + .win{border-top:1px solid var(--hair)}
.win .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.win .sp{font-size:12px;color:var(--ink-2)}
.win .st{font:500 11px var(--sans);padding:3px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2);white-space:nowrap}
.win .st.bad{background:oklch(0.58 0.2 27);color:var(--white);box-shadow:none}
.tip{font-size:13px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}

/* ---------- life: composite score, parts, rankings ---------- */
.parts{display:grid;gap:12px}
.part{display:grid;grid-template-columns:64px 1fr 36px;gap:12px;align-items:center;font-size:14px}
.part .pbar{height:10px;border-radius:999px;background:oklch(0.22 0.015 250 / .06);overflow:hidden}
.part .pbar i{display:block;height:100%;border-radius:inherit;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0));box-shadow:0 0 8px var(--c)}
.part .n{font:500 13px var(--sans);text-align:right}
.part.none .pbar{background:none;box-shadow:inset 0 0 0 1px var(--hair)}
.part .hint{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weak{margin-top:14px;font-size:13px;color:var(--ink-2)}
.weak b{font-weight:500;color:var(--ink)}
.prs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pr{display:grid;gap:1px;padding:8px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--hair);font-size:13px}
.pr span{font-size:11px;color:var(--ink-2)}
.coach{margin-top:14px;padding:12px 14px;border-radius:16px;background:oklch(0.22 0.015 250 / .05);font-size:14px;line-height:1.45}
.coach b{display:block;font:500 12px var(--sans);color:var(--ink-2);margin-bottom:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hair);font-size:13px}
.chip span{color:var(--ink-2);font-size:12px}
.foot{display:flex;justify-content:center;gap:8px;align-items:center;font:400 12px var(--sans);color:var(--ink-2);padding:4px 0 0}
.pulse{width:7px;height:7px;border-radius:50%;background:oklch(0.7 0.01 250)}
.pulse.on{background:oklch(0.62 0.15 150);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 oklch(0.62 0.15 150 / .5)}80%,100%{box-shadow:0 0 0 7px oklch(0.62 0.15 150 / 0)}}

/* list swaps use View Transitions where supported */
::view-transition-old(root),::view-transition-new(root){animation-duration:240ms;animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.tracks,.cats{view-transition-name:none}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:var(--z-login);display:grid;place-items:center;padding:24px;background:var(--bg)}
.login[hidden],.app[hidden]{display:none}
.login form{width:min(340px,100%);display:grid;gap:12px}
.login .orb{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;filter:blur(2px);
  background:radial-gradient(circle at 35% 30%,oklch(0.72 0.17 330),transparent 60%),radial-gradient(circle at 70% 75%,oklch(0.75 0.16 55),transparent 62%),oklch(0.35 0.07 280);
  animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.06);filter:blur(4px)}}
.login label{font:500 13px var(--sans);color:var(--ink-2)}
.login input{font:400 16px var(--sans);height:50px;padding:0 18px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px var(--hair);background:var(--white);color:var(--ink)}
.login input:focus{outline:2px solid var(--ink);outline-offset:2px}
.login button{height:50px;border-radius:999px;background:var(--ink);color:var(--white);font:500 15px var(--sans)}
.login p{min-height:1.4em;font-size:13px;color:oklch(0.5 0.18 27);text-align:center}

.loading .hero .val,.loading .t .v{color:transparent;text-shadow:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="loginForm">
    <div class="orb" aria-hidden="true"></div>
    <label for="key">Owner key</label>
    <input id="key" type="password" autocomplete="current-password">
    <button type="submit">Open dashboard</button>
    <p id="lerr" role="alert"></p>
  </form>
</div>

<main class="app loading" id="app">
  <section class="sun" id="sun" aria-labelledby="sun-t">
    <div class="sun-h"><h1 id="sun-t">Focus<small id="sub">Today</small></h1></div>
    <div class="lifebig dotnum" id="lifebig" aria-describedby="sunword">0</div>
    <p class="sun-w"><span id="sunword">Warming up</span><small id="sunrank">life score</small></p>
    <div class="arc" aria-hidden="true"><svg id="arc" viewBox="0 0 390 118" preserveAspectRatio="none"></svg></div>
    <div class="sun-row">
      <div><b id="wakev">--:--</b><small>Wake</small></div>
      <div class="mid"><svg viewBox="0 0 28 16" aria-hidden="true"><g fill="currentColor"><rect x="4" y="13" width="20" height="2"/><rect x="9" y="9" width="10" height="4"/><rect x="11" y="7" width="6" height="2"/><rect x="13" y="1" width="2" height="3"/><rect x="5" y="4" width="2" height="2"/><rect x="21" y="4" width="2" height="2"/><rect x="1" y="9" width="3" height="2"/><rect x="24" y="9" width="3" height="2"/></g></svg><small id="midl">Locked</small></div>
      <div><b id="bedv">--:--</b><small>Bedtime</small></div>
    </div>
    <div class="sun-cards">
      <div class="sc"><b>Focus</b><small>By hour</small><div class="v dotnum" id="scf">0:00</div><div class="wave" id="wave" aria-hidden="true"></div><div class="axis2"><span>4a</span><span id="sclvl">&nbsp;</span></div></div>
      <div class="sc"><b>Moments</b><small>Music · meals</small><div></div><div class="scatter" id="scatter" aria-hidden="true"></div><div class="axis2"><span>AM</span><span>PM</span></div></div>
    </div>
    <div class="sun-foot">
      <button class="round" id="refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
      </button>

      <div class="round lock" id="lock" role="img" aria-label="Games locked">
        <svg viewBox="0 0 32 32" style="width:22px;height:22px"><rect x="8" y="14" width="16" height="12" rx="3"/><path class="shackle" d="M11.5 14v-3.5a4.5 4.5 0 0 1 9 0V14"/></svg>
      </div>
    </div>
  </section>

  <div class="tabs" role="tablist" aria-label="Metric" id="tabs">
    <span class="pill" id="pill" aria-hidden="true"></span>
    <button class="tab" role="tab" aria-selected="true" data-m="focus">Focus</button>
    <button class="tab" role="tab" aria-selected="false" data-m="dist">Distracted</button>
    <button class="tab" role="tab" aria-selected="false" data-m="sleep">Sleep</button>
    <button class="tab" role="tab" aria-selected="false" data-m="active">Screen time</button>
  </div>

  <div class="col-a">
    <section class="hero" id="hero" aria-labelledby="ht">
      <div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="hero-h">
        <h2 class="swap" id="ht">Focus per day<small id="hs">productive time</small></h2>
        <div class="val dotnum swap" id="hv" aria-live="polite">0:00<small id="hd">today</small></div>
      </div>
      <div class="chart" id="chart">
        <svg viewBox="0 0 340 168" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
          <line class="goal" id="goal" x1="0" x2="340" y1="0" y2="0" vector-effect="non-scaling-stroke"/>
          <path class="area" id="area"/>
          <path class="line" id="line" vector-effect="non-scaling-stroke"/>
        </svg>
        <span class="goal-t" id="goalt">GOAL</span>
        <div class="knob" id="knob"><span class="stem" id="stem"></span><span class="o"></span></div>
      </div>
      <div class="days" id="days" role="group" aria-label="Pick a day"></div>
      <div class="range" id="range">&nbsp;</div>

    <div class="tiles">
      <button class="t score" id="t-score" aria-label="Focus score">

      </button>
      <button class="t left" id="t-left">
        <span class="k" id="k-left">To unlock</span><span></span>
        <span><span class="row"><span class="v dotnum" id="v-left">0:00</span><span class="b" id="b-left">0%</span></span><span class="prog"><i id="p-left"></i></span></span>
      </button>
      <button class="t med" id="t-med">
        <span class="k">Meditate</span><span></span>
        <span><span class="row"><span class="v dotnum" id="v-med">0<small>min</small></span><span class="b" id="b-med">of 10</span></span><span class="prog"><i id="p-med"></i></span></span>
      </button>
      <button class="t duo" id="t-duo">
        <span class="k">Duolingo</span><span></span>
        <span><span class="row"><span class="v dotnum" id="v-duo">0<small>xp</small></span><span class="b" id="b-duo">—</span></span><span class="prog"><i id="p-duo"></i></span></span>
      </button>
      <button class="t sleep" id="t-sleep">
        <span class="k">Sleep</span><span></span>
        <span><span class="row"><span class="v dotnum" id="v-sleep">-:--</span><span class="b" id="b-sleep">log it</span></span><span class="prog"><i id="p-sleep"></i></span></span>
      </button>
      <button class="t now" id="t-now">
        <span class="k" id="k-now">Now playing</span><span></span>
        <span class="np" id="np"><span class="disc gen" style="--d1:oklch(0.8 0.05 250);--d2:oklch(0.9 0.03 280)"></span><span class="tx"><span class="tt">Nothing yet</span><span class="ar">&nbsp;</span></span></span>
      </button>
    </div>
  </div>

  <div class="col-b">
    <section class="panel" id="lifepanel" aria-labelledby="h-life">
      <div class="ph"><h2 id="h-life">Life</h2><span class="aside" id="lrank"></span></div>
      <div class="parts" id="parts"></div>
      <p class="weak" id="weak" hidden></p>
      <div class="prs" id="prs"></div>
      <div class="coach" id="coach" hidden></div>
    </section>

    <section class="panel" id="daypanel" aria-labelledby="h-day">
      <div class="ph"><h2 id="h-day">Day</h2><span class="batt" id="batt"></span></div>
      <div class="bed off" id="bed"></div>
      <div class="strip-w" id="stripw"></div>
      <div class="axis" aria-hidden="true"><span>4a</span><span>8a</span><span>12p</span><span>4p</span><span>8p</span><span>12a</span><span>4a</span></div>
      <div id="classes"></div>

    <section class="panel" id="where" aria-labelledby="h-mix">
      <div class="ph"><h2 id="h-mix">Where it went</h2><span class="aside" id="mixtotal"></span></div>

      <button class="more" id="more" aria-expanded="false">Show all</button>

    <section class="panel" id="music" aria-labelledby="h-music">
      <div class="ph"><h2 id="h-music">Music</h2>
        <div class="seg" role="group" aria-label="Music list"><button data-v="recent" aria-pressed="true">Recent</button><button data-v="today" aria-pressed="false">Today</button><button data-v="week" aria-pressed="false">Week</button></div>
      </div>

    <section class="panel" aria-labelledby="h-apps">

</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm = m => `${Math.floor(m/60)}:${String(Math.round(m)%60).padStart(2,'0')}`;
const dur = m => m >= 60 ? `${Math.floor(m/60)}h ${String(Math.round(m)%60).padStart(2,'0')}m` : `${Math.round(m)}m`;
const ago = ms => { const m = Math.round((Date.now()-ms)/60000); return m < 1 ? 'now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.floor(m/60)}h ago` : `${Math.floor(m/1440)}d ago`; };
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const live = () => !calm && document.visibilityState === 'visible';
const ease = t => 1 - Math.pow(1 - t, 5);   // quint out
const vt = fn => { if (!(live() && document.startViewTransition)) return fn(); const t = document.startViewTransition(fn); [t.ready, t.finished, t.updateCallbackDone].forEach(p => p && p.catch(() => {})); };

/* one fixed hue per category, everywhere */
const HUE = {
  'Studio':'oklch(0.72 0.17 48)', 'Studio > CAD + 3D':'oklch(0.68 0.19 42)', 'Studio > Graphics':'oklch(0.76 0.15 60)',
  'Studio > Fab':'oklch(0.62 0.18 35)', 'Studio > Research':'oklch(0.82 0.12 72)',
  'School':'oklch(0.78 0.17 125)', 'Code + AI':'oklch(0.68 0.13 255)',
  'Comms':'oklch(0.72 0.10 290)', 'Media > YouTube':'oklch(0.70 0.13 355)', 'Media > Music':'oklch(0.78 0.10 330)',
  'Media > Social':'oklch(0.60 0.20 22)', 'Games':'oklch(0.52 0.21 27)', 'Uncategorized':'oklch(0.80 0.01 250)'
};
const hue = c => HUE[c.name] || HUE[c.name.split(' > ')[0]] || c.color || 'oklch(0.8 0.01 250)';

/* film grain, generated once */
(() => { try {
  const c = document.createElement('canvas'); c.width = c.height = 150; const x = c.getContext('2d');
  const d = x.createImageData(150,150); for (let i=0;i<d.data.length;i+=4){ const v = Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  x.putImageData(d,0,0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
} catch {} })();

/* count-up: the final value is written first, so a frozen frame still shows the truth */
const counters = new WeakMap();
function count(el, to, fmt){
  const from = counters.get(el) ?? 0; counters.set(el, to);
  el.firstChild.nodeValue = fmt(to);
  if (!live() || from === to) return;
  const t0 = performance.now(), D = 900;
  const step = now => { const k = Math.min(1,(now-t0)/D); el.firstChild.nodeValue = fmt(from + (to-from)*ease(k)); if (k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
/* text swap: blur out, change, blur in */
function swap(el, fn){
  if (!live()) return fn();
  el.classList.add('out');
  setTimeout(() => { fn(); el.classList.remove('out'); }, 200);
}

/* ---------- chart ---------- */
const W = 340, H = 168, TOP = 20, BOT = 18;
const METRICS = {
  focus:  {title:'Focus per day', sub:'productive time', key:'productive_min', hues:[250,205,40]},
  dist:   {title:'Distracted per day', sub:'social, games, feeds', key:'distracting_min', hues:[330,15,45]},
  sleep:  {title:'Sleep per night', sub:'bed to alarm', key:'sleep_min', hues:[285,255,320], goal:480},
  active: {title:'Screen time per day', sub:'all active PC time', key:'total_min', hues:[270,235,300]},
};
const goalOf = () => metric === 'focus' ? data.goal_min : (METRICS[metric].goal || 0);
const val = (w, m = metric) => w[METRICS[m].key] || 0;
let metric = 'focus', sel = 6, shown = null, chartAnim = 0;

const xs = n => Array.from({length:n}, (_,i) => (i + .5) / n * W);
function scale(vals){
  const g = goalOf() * 1.15;
  const max = Math.max(60, g, ...vals) * 1.08;
  return v => H - BOT - (v / max) * (H - TOP - BOT);
}
/* monotone cubic (no overshoot below zero): returns bezier segments */
function segs(px, py){
  const n = px.length, d = [], m = [];
  for (let i=0;i<n-1;i++) d.push((py[i+1]-py[i])/(px[i+1]-px[i]));
  m[0] = d[0]; m[n-1] = d[n-2];
  for (let i=1;i<n-1;i++) m[i] = d[i-1]*d[i] <= 0 ? 0 : 3*(px[i+1]-px[i-1]) / ((2*px[i+1]-px[i]-px[i-1])/d[i-1] + (px[i+1]+px[i]-2*px[i-1])/d[i]);
  const out = [];
  for (let i=0;i<n-1;i++){ const h = (px[i+1]-px[i])/3;
    out.push([px[i],py[i], px[i]+h,py[i]+m[i]*h, px[i+1]-h,py[i+1]-m[i+1]*h, px[i+1],py[i+1]]); }
  return out;
}

const LIFE_WORDS = [[95,'Peak day'],[80,'Great day'],[60,'Good day'],[40,'Steady'],[20,'Slow day'],[0,'Rough day']];
function renderSun(){
  const d = data, L = d.life || {}, sc = d.schedule || {}, tl = d.timeline || {};
  const sh = tl.start_hour ?? 4, start = new Date(`${d.date}T${pad(sh)}:00`).getTime(), DAY = 864e5, now = Date.now();
  const ls = L.today && L.today.score != null ? L.today.score : (d.score || 0);
  $('sun').style.setProperty('--s', (ls/100).toFixed(3));
  count($('lifebig'), ls, v => Math.round(v));
  $('sunword').textContent = LIFE_WORDS.find(([f]) => ls >= f)[1];
  $('sunrank').textContent = L.rank && L.rank.of > 1 ? `#${L.rank.pos} of ${L.rank.of} days` : 'life score';
  $('lifebig').setAttribute('aria-label', `Life score ${ls}`);

  // wake = watch/phone sleep, else the first active hour; bed = tonight's bedtime, else the usual bedtime label
  const firstHr = (tl.hours || []).findIndex(h => h && Object.values(h).some(v => v > 120));
  const wake = L.sleep ? L.sleep.wake : firstHr >= 0 ? start + firstHr * 3600e3 : start + 4 * 3600e3;
  let bed = sc.bedtime;
  if (!bed) { const [bh, bm] = (sc.bedtime_label || '01:00').split(':').map(Number);
    bed = new Date(`${d.date}T${pad(bh)}:${pad(bm)}`).getTime() + (bh < sh ? DAY : 0); }
  $('wakev').textContent = clock(wake).replace(/\s?[AP]M/, ''); $('bedv').textContent = clock(bed).replace(/\s?[AP]M/, '');
  const left = Math.max(0, d.goal_min - d.productive_min);
  $('midl').textContent = d.unlocked ? 'Unlocked' : `${hm(left)} to unlock`;

  // arc: the waking day is the sun's path above the horizon, the night a dotted dip below it
  const svg = $('arc'), W = Math.max(300, svg.clientWidth || 390), HZ = 96;
  svg.setAttribute('viewBox', `0 0 ${W} 118`);
  const X = ms => Math.max(0, Math.min(1, (ms - start) / DAY)) * W, wx = X(wake), bx = Math.max(X(bed), wx + 40);
  const Y = x => { if (x >= wx && x <= bx) return HZ - 78 * Math.sin(Math.PI * (x - wx) / (bx - wx));
    const nl = W - (bx - wx), o = x < wx ? x + (W - bx) : x - bx; return HZ + 14 * Math.sin(Math.PI * o / nl); };
  const path = (a, b) => { let p = ''; for (let x = a; x <= b + .01; x += 3) p += `${p ? 'L' : 'M'}${Math.min(x, b).toFixed(1)} ${Y(Math.min(x, b)).toFixed(1)}`; return p; };
  const xn = X(now), yn = Y(xn);
  const rays = Array.from({length: 8}, (_, i) => { const a = i * Math.PI / 4; return `<line class="ray" x1="${(xn + Math.cos(a)*6).toFixed(1)}" y1="${(yn + Math.sin(a)*6).toFixed(1)}" x2="${(xn + Math.cos(a)*8.5).toFixed(1)}" y2="${(yn + Math.sin(a)*8.5).toFixed(1)}"/>`; }).join('');

    + `<path class="night" d="${path(0, wx)}"/><path class="night" d="${path(bx, W)}"/><path class="day" d="${path(wx, bx)}"/>`
    + `<line class="stem" x1="${xn}" x2="${xn}" y1="${yn}" y2="${HZ}"/>`
    + [wx, bx, xn].map(x => `<circle class="pin" cx="${x}" cy="${HZ}" r="3"/>`).join('')
    + `<circle class="halo" cx="${xn}" cy="${yn}" r="16"/><circle class="pin" cx="${xn}" cy="${yn}" r="3.4"/>${rays}`;

  // focus by hour: one line per hour, the current hour lit
  const prodCat = new Set(d.categories.filter(c => c.score > 0).map(c => c.name)), nowH = Math.floor((now - start) / 3600e3);
  $('wave').innerHTML = (tl.hours || []).map((h, i) => { const sec = Object.entries(h || {}).reduce((s, [k, v]) => s + (prodCat.has(k) ? v : 0), 0);
    return `<i class="${i === nowH ? 'now' : sec > 300 ? 'on' : ''}" style="height:${Math.max(6, Math.min(46, sec / 3600 * 46)).toFixed(0)}px"></i>`; }).join('');
  count($('scf'), d.productive_min, hm);
  $('sclvl').textContent = 'now';

  // moments: songs, meals, meditation placed by time of day
  const pos = at => ((at - start) / DAY * 100).toFixed(1), hash = t => [...String(t)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7);
  const inDay = at => at >= start && at < start + DAY;
  const dots = (d.recent || []).filter(t => inDay(t.at)).map(t => `<i style="left:${pos(t.at)}%;top:${15 + hash(t.title) % 70}%"></i>`)
    .concat((L.meals_today || []).map(m => `<i class="meal${m.r === 0 ? ' junk' : ''}" style="left:${pos(m.at)}%;top:${m.r === 2 ? 30 : m.r === 1 ? 50 : 70}%"></i>`))
    .concat(d.phone && d.phone.at && inDay(d.phone.at) ? [`<i class="med" style="left:${pos(d.phone.at)}%;top:50%"></i>`] : []);
  $('scatter').innerHTML = dots.join('');

  // dial: ticks fill toward the unlock goal
  const dial = $('dial'), DW = Math.max(160, dial.clientWidth || 220), p = Math.min(1, d.productive_min / d.goal_min), N = 31, cx = DW / 2, cy = 74, r = 64;
  const ang = k => Math.PI * (1.22 + .56 * k);
  let t = '';
  for (let i = 0; i < N; i++) { const a = ang(i / (N - 1)), l = i % 5 ? 7 : 11;
    t += `<line class="${i / (N - 1) <= p ? 'on' : ''}" x1="${(cx + Math.cos(a) * r).toFixed(1)}" y1="${(cy + Math.sin(a) * r).toFixed(1)}" x2="${(cx + Math.cos(a) * (r - l)).toFixed(1)}" y2="${(cy + Math.sin(a) * (r - l)).toFixed(1)}"/>`; }
  const ka = ang(p), kx = cx + Math.cos(ka) * (r - 18), ky = cy + Math.sin(ka) * (r - 18);
  dial.innerHTML = `<svg viewBox="0 0 ${DW} 52">${t}<circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="9"/><text x="${kx.toFixed(1)}" y="${ky.toFixed(1)}">${d.unlocked ? '✓' : 'F'}</text></svg>`;
  dial.setAttribute('aria-label', `${Math.round(p * 100)}% of the ${d.goal_min / 60} hour goal`);
}

/* ---------- life panel ---------- */
const PARTS = [['focus','Focus','oklch(0.72 0.17 48)','PC focus time'],['sleep','Sleep','oklch(0.62 0.13 285)','Sleep Focus + alarm Shortcuts'],
               ['food','Food','oklch(0.72 0.17 140)','tap the Meal Shortcut'],['habits','Habits','oklch(0.70 0.15 330)','meditate + Duolingo']];
function renderLife(){
  const L = data.life; $('lifepanel').hidden = !L; if (!L) return;
  const t = L.today || {}, sd = s => new Date(s+'T12:00').toLocaleDateString('en-US',{month:'short', day:'numeric'});
  const dow = new Date(data.date+'T12:00').toLocaleDateString('en-US',{weekday:'long'});
  $('lrank').textContent = L.rank ? `#${L.rank.pos} of ${L.rank.of} days${L.rank_dow && L.rank_dow.of > 1 ? ` · #${L.rank_dow.pos} ${dow}` : ''}` : '';
  $('parts').innerHTML = PARTS.map(([k,name,c,hint]) => t[k] == null
    ? `<div class="part none"><span>${name}</span><span class="hint">${hint}</span><span class="n">—</span></div>`
    : `<div class="part" style="--c:${c}"><span>${name}</span><span class="pbar"><i style="--f:${(t[k]/100).toFixed(3)}"></i></span><span class="n">${t[k]}</span></div>`).join('');
  const W = L.weak; $('weak').hidden = !W;
  if (W) $('weak').innerHTML = `This week <b>${PARTS.find(p => p[0] === W.area)[1].toLowerCase()}</b> pulls your score down most (avg ${W.avg}).`;
  const P = L.prs || {};
  $('prs').innerHTML = [P.score && `<span class="pr">${P.score.value}<span>best day · ${sd(P.score.day)}</span></span>`,
    P.sleep_min && `<span class="pr">${dur(P.sleep_min.value)}<span>longest sleep · ${sd(P.sleep_min.day)}</span></span>`,
    P.focus_min && `<span class="pr">${dur(P.focus_min.value)}<span>most focus · ${sd(P.focus_min.day)}</span></span>`].filter(Boolean).join('');
  const PH = L.phone;
  if (PH && Object.keys(PH).length) { const tot = Object.values(PH).reduce((x,y)=>x+y,0), top = Object.entries(PH).sort((x,y)=>y[1]-x[1]).slice(0,2);
    $('prs').innerHTML += `<span class="pr">${dur(tot)} on phone<span>${top.map(([a,m]) => `${esc(a)} ${dur(m)}`).join(' · ')}</span></span>`; }
  const G = L.garmin, S = L.sleep;
  if (G || (S && S.stages)) $('prs').innerHTML += [
    S && S.stages && `<span class="pr">${dur(S.stages.deep)} deep · ${dur(S.stages.rem)} REM<span>last night (Garmin)</span></span>`,
    G && G.steps != null && `<span class="pr">${G.steps.toLocaleString()}<span>steps today</span></span>`,
    G && G.bb != null && `<span class="pr">${G.bb}<span>Body Battery</span></span>`,
    G && G.rhr != null && `<span class="pr">${G.rhr} bpm<span>resting HR</span></span>`].filter(Boolean).join('');
  const C = L.coach; $('coach').hidden = !(C && C.text);
  if (C && C.text) $('coach').innerHTML = `<b>Coach · ${esc(C.week || '')}</b>${esc(C.text).replace(/\n/g,'<br>')}`;
}

let catSel = null;
function renderWhere(){
  const cats = data.categories.filter(c => c.sec >= 60).sort((a,b) => b.sec - a.sec), total = cats.reduce((s,c)=>s+c.sec,0) || 1;
  $('mixtotal').textContent = dur(data.total_min);
  $('mix').innerHTML = cats.map((c,i) => `<i style="--c:${hue(c)};flex:${(c.sec/total).toFixed(4)} 1 0" data-i="${i}" class="${catSel===c.name?'sel':''}"></i>`).join('');
  const list = showAll ? cats : cats.slice(0, 5);
  $('cats').innerHTML = list.map(c => { const [a,...b] = c.name.split(' > ');
    return `<div class="cat${c.score<0?' neg':''}${catSel===c.name?' sel':''}" style="--c:${hue(c)}" data-n="${esc(c.name)}"><span class="sw"></span><span class="n">${esc(b.length ? b.join(' > ') : a)}${b.length ? `<span>${esc(a)}</span>` : ''}</span><span class="m">${dur(Math.round(c.sec/60))}</span></div>`;
  }).join('') || '<p class="empty">No activity yet today</p>';
  $('more').hidden = cats.length <= 5;
  $('more').textContent = showAll ? 'Show less' : `Show all ${cats.length}`;
  $('more').setAttribute('aria-expanded', showAll);
  [...$('mix').children].forEach(seg => seg.onclick = () => { const c = cats[+seg.dataset.i]; catSel = catSel === c.name ? null : c.name;
    if (catSel && !showAll && cats.indexOf(c) >= 5) showAll = true; renderWhere(); });
}
$('more').onclick = () => vt(() => { showAll = !showAll; renderWhere(); });

function renderMusic(){
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === musicView));
  let html;
  if (musicView === 'recent') {
    const rec = data.recent || [];
    html = rec.map((t,i) => `<div class="track">${disc(t,i)}<div><div class="tt">${esc(t.title)}</div><div class="ar">${esc(t.artist)}</div></div><span class="m">${i===0 && data.now && data.now.title===t.title ? '<span class="eq"><i></i><i></i><i></i></span>' : ago(t.at)}</span></div>`).join('');
    html = html || '<p class="empty">Songs appear here as you play them, on Spotify (any device) or in the browser.</p>';
  } else {
    const list = musicView === 'today' ? data.music_today : data.music_week;
    html = list.map((t,i) => `<div class="track">${disc(t,i)}<div><div class="tt">${esc(t.title)}</div><div class="ar">${esc(t.artist)}</div></div><span class="m">${dur(t.min)}</span></div>`).join('')
      || '<p class="empty">Nothing played yet.</p>';
  }
  $('tracks').innerHTML = html;
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { if (!data || b.dataset.v === musicView) return; musicView = b.dataset.v; vt(renderMusic); });

/* tiles jump to the detail they summarize */
const go = id => $(id).scrollIntoView({behavior: calm ? 'auto' : 'smooth', block:'start'});
$('t-now').onclick = () => go('music');
$('t-sleep').onclick = () => { data && setMetric('sleep'); scrollTo({top:0, behavior: calm ? 'auto' : 'smooth'}); };
$('t-left').onclick = () => { data && setMetric('focus'); scrollTo({top:0, behavior: calm ? 'auto' : 'smooth'}); };
$('t-score').onclick = () => go('lifepanel');

/* ---------- data ---------- */
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const store = (() => { try { return localStorage } catch { return null } })();
const getKey = () => { try { return store && store.getItem('tj_focus_key') } catch { return null } };
function showLogin(msg){ $('app').hidden = true; $('login').hidden = false; $('lerr').textContent = msg || ''; $('key').focus(); }
$('loginForm').onsubmit = e => { e.preventDefault(); try { store && store.setItem('tj_focus_key', $('key').value) } catch {}; $('login').hidden = true; $('app').hidden = false; load(); };
$('refresh').onclick = () => { const r = $('refresh'); r.classList.remove('spin'); void r.offsetWidth; r.classList.add('spin'); load(); };

async function load(){
  try {
    let r;
    if (LOCAL) r = await fetch('/api/today', {cache:'no-store'});
    else {
      const k = getKey(); if (!k) return showLogin();
      r = await fetch('/api/focus', {headers:{'x-key':k}, cache:'no-store'});
      if (r.status === 401 || r.status === 429) { try { store.removeItem('tj_focus_key') } catch {}; return showLogin(r.status === 429 ? 'Too many tries. Wait 15 minutes.' : 'That key didn’t work.'); }
    }
    if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status);
    data = await r.json(); render();
  } catch (e) {
    $('upd').innerHTML = `<span class="pulse"></span>${LOCAL ? 'ActivityWatch not reachable' : 'Can’t reach the dashboard'} (${esc(e.message)})`;
  }
}
load(); setInterval(() => document.visibilityState === 'visible' && load(), 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
