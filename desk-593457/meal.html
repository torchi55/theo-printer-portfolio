<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Log</title>
<meta name="description" content="Private one-tap meal log.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal">
<meta name="theme-color" content="#f3dcd2">
<link rel="apple-touch-icon" href="/desk-593457/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:oklch(0.18 0.02 40);--ink-2:oklch(0.18 0.02 40 / .5);--ease:cubic-bezier(0.22,1,0.36,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.4 'Geist',-apple-system,system-ui,sans-serif;color:var(--ink);display:grid;grid-template-rows:auto 1fr auto;gap:18px;
  padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(70% 40% at 50% 45%,oklch(0.92 0.15 95 / .9),transparent 72%),linear-gradient(180deg,oklch(0.94 0.035 25),oklch(0.90 0.1 50) 50%,oklch(0.80 0.14 45));
  -webkit-tap-highlight-color:transparent}
h1{font:600 20px/1.15 'Geist',sans-serif}
h1 small{display:block;color:var(--ink-2)}
.opts{display:grid;gap:12px;align-content:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-radius:24px;font:600 22px 'Geist',sans-serif;
  background:oklch(1 0.02 80 / .22);box-shadow:inset 0 0 0 1px oklch(1 0.02 80 / .4);transition:transform .2s var(--ease),background .3s}
.opt:active{transform:scale(.97)}
.opt span{font:400 14px 'Geist',sans-serif;color:var(--ink-2)}
.opt.sent{background:var(--ink);color:oklch(0.97 0.02 80)}
.opt.sent span{color:oklch(0.97 0.02 80 / .7)}
.opt:focus-visible,input:focus{outline:2px solid var(--ink);outline-offset:3px}
.foot{text-align:center;font-size:14px;color:var(--ink-2);min-height:1.4em}
.n{font-family:'Doto',monospace;font-weight:900;font-size:56px;text-align:center;line-height:1}
form{display:grid;gap:10px}
input{font:16px 'Geist',sans-serif;height:50px;padding:0 18px;border-radius:999px;border:0;background:oklch(1 0 0 / .7);color:var(--ink)}
form button{height:50px;border-radius:999px;background:var(--ink);color:oklch(0.97 0.02 80);font-weight:500}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<h1>Meal<small id="sub">How was it?</small></h1>
<main class="opts" id="opts">
  <div class="n" id="count" aria-live="polite">0</div>
  <p class="foot" style="margin-top:-8px">meals logged today</p>
  <button class="opt" data-r="good">Good <span>whole food, protein</span></button>
  <button class="opt" data-r="ok">OK <span>fine, not great</span></button>
  <button class="opt" data-r="junk">Junk <span>fast food, snacks</span></button>
</main>
<form id="login" hidden>
  <label for="key" style="font-size:14px;color:var(--ink-2)">Owner key (same as the dashboard)</label>
  <input id="key" type="password" autocomplete="current-password">
  <button type="submit">Save key</button>
</form>
<p class="foot" id="msg"></p>
<script>
const $ = id => document.getElementById(id);
const store = (() => { try { return localStorage } catch { return null } })();
const getKey = () => { try { return store && store.getItem('tj_focus_key') } catch { return null } };
const today = () => new Date(Date.now() - 4 * 3600e3).toLocaleDateString('en-CA');   // day starts 4am, like the dashboard
const countKey = () => 'tj_meals_' + today();
const showCount = () => { let n = 0; try { n = +(store.getItem(countKey()) || 0) } catch {} $('count').textContent = n; };
function needKey(msg){ $('opts').hidden = true; $('login').hidden = false; $('msg').textContent = msg || ''; $('key').focus(); }
$('login').onsubmit = e => { e.preventDefault(); try { store.setItem('tj_focus_key', $('key').value) } catch {}; $('login').hidden = true; $('opts').hidden = false; $('msg').textContent = 'Key saved. Tap a meal.'; };
document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
  const k = getKey(); if (!k) return needKey();
  $('msg').textContent = 'Sending…';
  try {
    const r = await fetch('/api/focus', {method:'POST', headers:{'x-key':k, 'Content-Type':'application/json'}, body: JSON.stringify({event:'meal', rating:b.dataset.r})});
    if (r.status === 401) { try { store.removeItem('tj_focus_key') } catch {}; return needKey('That key didn’t work.'); }
    if (r.status === 429) throw new Error('locked for 15 min');
    if (!r.ok) throw new Error(r.status);
    try { store.setItem(countKey(), +(store.getItem(countKey()) || 0) + 1) } catch {}
    showCount(); b.classList.add('sent'); setTimeout(() => b.classList.remove('sent'), 1400);
    $('msg').textContent = `Logged ${b.dataset.r} · ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
  } catch (e) { $('msg').textContent = `Couldn’t send (${e.message}). Try again.`; }
});
if (!getKey()) needKey('Enter your key once; this phone remembers it.');
showCount();
</script>
</body>
</html>
