<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sundial</title>
<meta name="description" content="Private Focus Gate day dial.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sundial">
<meta name="theme-color" content="#123b33">
<link rel="icon" type="image/png" sizes="32x32" href="/desk-593457/assets/icon-32.png">
<link rel="apple-touch-icon" href="/desk-593457/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Michroma&display=swap" rel="stylesheet">
<style>
/* The desk's green-grain palette: deep green edges, teal, a peach core, cream ink, grain on top. Display = Michroma (Eurostile stand-in). */
:root{
  --g-bg: oklch(0.2 0.04 178); --g-deep: oklch(0.16 0.04 180); --g-mid: oklch(0.4 0.08 172); --g-teal: oklch(0.52 0.095 168);
  --cream: oklch(0.97 0.025 90); --cream-2: oklch(0.97 0.025 90 / .7); --cream-3: oklch(0.97 0.025 90 / .14);
  --peach: oklch(0.8 0.1 48); --glow: oklch(0.93 0.07 75); --lav: oklch(0.74 0.08 295); --coral: oklch(0.7 0.15 25); --sky: oklch(0.8 0.08 220);
  --ink: oklch(0.22 0.05 178);             /* text on peach / cream */
  --disp: 'Michroma', 'Eurostile', ui-sans-serif, sans-serif;
  --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;background:var(--g-bg)}
body{color:var(--cream);font:15px/1.4 var(--sans);font-feature-settings:'tnum';-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  background:radial-gradient(85% 55% at 50% 44%, var(--g-teal), var(--g-mid) 55%, var(--g-bg) 100%) fixed}
body::after{content:'';position:fixed;inset:0;z-index:20;background-image:var(--grain);background-size:150px;opacity:.2;mix-blend-mode:overlay;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hd h1{font:400 20px/1.15 var(--disp);letter-spacing:.01em;white-space:nowrap}
.hd p{font-size:14px;color:var(--cream-2);margin-top:5px}
.hd .wx{text-align:right;white-space:nowrap}
.hd .wx b{font:400 20px/1.15 var(--disp)}
.hd .wx b span{font-family:var(--sans)}

.days{display:inline-flex;gap:2px;padding:3px;margin-top:12px;border-radius:999px;background:var(--cream-3);font-size:13px;font-weight:600}
.days button{padding:6px 13px;border-radius:999px;color:var(--cream-2);transition:background-color .2s var(--ease), color .2s var(--ease)}
.days button[aria-pressed=true]{background:oklch(0.97 0.025 90 / .16);color:var(--cream)}

/* dial */
.stage{margin:0 -14px;display:grid;place-items:center;min-height:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;container-type:size}
.dial{position:relative;width:min(100cqw, 100cqh);aspect-ratio:1;container-type:inline-size}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .hit{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
.dial .hitdot{fill:transparent;cursor:pointer}
.dial .arc,.dial .dot{transition:opacity .2s var(--ease), stroke-width .2s var(--ease)}
.dial svg.dim .arc:not(.sel),.dial svg.dim .dot:not(.sel){opacity:.28}
.dial .lbl{font:600 11px var(--sans);letter-spacing:.01em;pointer-events:none}
.dial .num{font:400 10px var(--disp);fill:var(--cream);opacity:.55}

/* the center: whatever matters now, or whatever was tapped */
.core{position:absolute;inset:28%;border-radius:50%;display:grid;place-content:center;justify-items:center;text-align:center;gap:.6cqi;padding:0 3cqi;
  color:var(--ink);cursor:pointer}
.core .t{font-weight:650;font-size:3.7cqi;line-height:1.2;max-width:36cqi;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.core .big{font:400 9.4cqi/1 var(--disp);margin-top:.6cqi;white-space:nowrap}
.core .big small{font:600 3.2cqi var(--sans);margin-left:.8cqi}
.core .s{font-size:3.1cqi;font-weight:500;opacity:.8;line-height:1.3;max-width:36cqi}
.core .rule{width:14cqi;height:1px;background:oklch(0.22 0.05 178 / .25);margin:.8cqi 0 .4cqi}
.core .u{font-size:3.1cqi;font-weight:650}
.core .back{font-size:2.7cqi;font-weight:600;opacity:.55;margin-top:.4cqi}
.core > *{animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(3px)}}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cream-3)}
.stats > div{padding:12px 0 2px;display:grid;gap:3px}
.stats > div + div{padding-left:14px;border-left:1px solid var(--cream-3)}
.stats small{font-size:12px;color:var(--cream-2)}
.stats b{font:400 16px/1.2 var(--disp)}
.stats b i{font:500 12px var(--sans);font-style:normal;color:var(--cream-2);margin-left:4px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--cream-2);padding-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}

#login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--g-bg);z-index:30}
#login form{display:grid;gap:12px;width:min(320px,100%)}
#login input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--cream-3);background:oklch(1 0 0 / .06);color:var(--cream)}
#login button{padding:12px;border-radius:12px;background:var(--peach);color:var(--ink);font-weight:650}
#login p{color:var(--cream-2);font-size:14px}
#msg{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 6px);z-index:21;font-size:12px;text-align:center;color:var(--cream-2);pointer-events:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm">
    <p>Same key as the desk.</p>
    <label class="sr" for="key">Owner key</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="Owner key" required>
    <button type="submit">Open the dial</button>
    <p id="lerr" role="alert"></p>
  </form>
</div>

<main class="app">
  <header>
    <div class="hd"><div><h1 id="h-day">&nbsp;</h1><p id="h-sub">&nbsp;</p></div><div class="wx"><b id="h-t"></b><p id="h-sun"></p></div></div>
    <div class="days" role="group" aria-label="Day"><button data-off="0" aria-pressed="true">Today</button><button data-off="1" aria-pressed="false">Tomorrow</button></div>
  </header>
  <div class="stage" id="stage"><div class="dial" id="dial"><svg id="svg" viewBox="0 0 400 400" aria-label="24 hour dial, noon at the top"></svg><div class="core" id="core" role="status" aria-live="polite"></div></div></div>
  <footer>
    <div class="stats" id="stats"></div>
    <div class="legend" aria-hidden="true"><span style="--c:var(--cream)">Work</span><span style="--c:var(--coral)">Social</span><span style="--c:var(--sky)">Moving</span><span style="--c:var(--lav)">Sleep</span></div>
  </footer>
</main>
<div id="msg" role="status"></div>

<script>
/* Sundial: Focus Gate's day as a 24 h dial (noon at the top). Same owner key + live data as the desk (/api/focus).
   Tap an arc or dot to see it in the center; tap the center to go back to now. Weather + sun times: Open-Meteo (no key). */
const $ = id => document.getElementById(id), DAY = 864e5, HR = 36e5;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (t, n) => t.length > n ? t.slice(0, Math.max(1, n - 1)).trimEnd() + '…' : t;
const pad = n => String(n).padStart(2, '0');
const t12 = h => { h = ((h % 24) + 24) % 24; let H = Math.floor(h), m = Math.round((h - H) * 60); if (m === 60) { H = (H + 1) % 24; m = 0 }
  return (H % 12 || 12) + (m ? ':' + pad(m) : '') + (H < 12 ? 'a' : 'p') };
const hm = min => { min = Math.max(0, Math.round(min)); return Math.floor(min / 60) + ':' + pad(min % 60) };
const dur = min => { min = Math.max(0, Math.round(min)); return min < 60 ? min + 'm' : Math.floor(min / 60) + 'h' + (min % 60 ? pad(min % 60) : '') };
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const store = (() => { try { return localStorage } catch { return null } })();
const sget = k => { try { return store && store.getItem(k) } catch { return null } };
const sset = (k, v) => { try { store && store.setItem(k, v) } catch {} };

let RAW = null, WX = null, OFF = 0, SEL = null;

/* ---------- model: everything the dial needs for day OFF (0 today, 1 tomorrow) ---------- */
function model(off) {
  const d = RAW, now = Date.now(), L = d.life || {}, sc = d.schedule || {}, tl = d.timeline || {};
  const day0 = new Date(d.date + 'T00:00').getTime(), base = day0 + off * DAY, h = t => (t - base) / HR;
  const iso = new Date(base + 12 * HR).toLocaleDateString('en-CA');
  // hourly activity (minutes): f = productive, d = distracting, m = moving
  const cats = d.categories || [], prod = new Set(cats.filter(c => c.score > 0).map(c => c.name)), bad = new Set(cats.filter(c => c.score < 0).map(c => c.name));
  const hours = Array.from({length: 24}, () => ({f: 0, d: 0, m: 0}));
  if (off === 0) (tl.hours || []).forEach((o, i) => { const hr = (tl.start_hour ?? 4) + i; if (hr > 23 || !o) return;
    for (const [k, v] of Object.entries(o)) { const m = v / 60;
      if (/^Move/.test(k)) hours[hr].m += m; else if (prod.has(k)) hours[hr].f += m; else if (bad.has(k) || /Social|Games/.test(k)) hours[hr].d += m } });
  // events: Google Calendar + the gate's class schedule (deduped), cut to this day
  const all = [], seen = new Set();
  for (const e of ((d.calendar && d.calendar.events) || [])) all.push({start: e.start, end: e.end, title: e.title, cal: e.cal || '', all_day: e.all_day, where: e.location});
  const iso1 = new Date(day0 + DAY + 12 * HR).toLocaleDateString('en-CA');
  for (const [arr, di] of [[sc.today, d.date], [sc.tomorrow, iso1]]) for (const c of arr || []) { const s = new Date(`${di}T${c.start}`).getTime();
    if (!all.some(e => !e.all_day && Math.abs(e.start - s) < 6e5)) all.push({start: s, end: new Date(`${di}T${c.end}`).getTime(), title: c.name, cal: 'School', where: c.where}); }
  const evs = all.filter(e => { const k = e.start + '|' + String(e.title).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return e.end > base && e.start < base + DAY })
    .sort((a, b) => a.start - b.start);
  const timed = evs.filter(e => !e.all_day).map((e, i) => ({...e, id: 'e' + i, a: Math.max(0, h(e.start)), b: Math.min(24, h(e.end)),
    plan: /^(work:|move|wind down|🛏)/i.test(e.title), now: now >= e.start && now < e.end, done: now >= e.end}));
  // sleep: last night (today) and tonight's plan
  const bed = sc.bedtime, pw = sc.bed_plan && sc.bed_plan.wake, pwH = pw ? +pw.split(':')[0] + pw.split(':')[1] / 60 : null;
  let sleep = null, plan = null;
  if (off === 0 && L.sleep && L.sleep.wake > base - 6 * HR) sleep = {a: Math.max(0, h(L.sleep.bed)), b: h(L.sleep.wake), min: L.sleep.min, score: L.sleep.score ?? (L.today || {}).sleep};
  if (off === 0 && bed) plan = {a: Math.min(24, h(bed)), b: 24, bed: h(bed), wake: pwH};
  if (off === 1 && bed) plan = {a: Math.max(0, h(bed)), b: pwH ?? 8, bed: h(bed), wake: pwH};
  // weather + sun
  let rise = 7, set = 18.4, lo = null, hi = null, nowT = null;
  if (WX && WX.daily) { const i = WX.daily.time.indexOf(iso);
    if (i >= 0) { const hh = s => { const t = new Date(s); return t.getHours() + t.getMinutes() / 60 };
      rise = hh(WX.daily.sunrise[i]); set = hh(WX.daily.sunset[i]); lo = Math.round(WX.daily.temperature_2m_min[i]); hi = Math.round(WX.daily.temperature_2m_max[i]) }
    if (off === 0 && WX.current) nowT = Math.round(WX.current.temperature_2m); }
  const elev = x => x > rise && x < set ? Math.sin(Math.PI * (x - rise) / (set - rise)) : -0.25;
  const nowH = off === 0 ? h(now) : null;
  const cur = timed.find(e => e.now), next = timed.find(e => e.start > now);
  const focus = {min: d.productive_min || 0, goal: d.goal_min || 120, unlocked: !!d.unlocked};
  focus.left = Math.max(0, focus.goal - focus.min);
  const date = new Date(base + 12 * HR);
  return {off, now, base, h, date, hours, timed, sleep, plan, rise, set, lo, hi, nowT, elev, nowH, cur, next, focus,
    wd: date.toLocaleDateString('en-US', {weekday: 'long'}), md: date.toLocaleDateString('en-US', {month: 'long', day: 'numeric'}),
    clock: new Date(now).toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toLowerCase()};
}

/* ---------- dial geometry (viewBox 400, noon at the top) ---------- */
const C = 200, R_RIM = 176, RIM_W = 22;
const P = (x, r) => { const a = (x - 12) / 24 * 2 * Math.PI; return [C + r * Math.sin(a), C - r * Math.cos(a)] };
const f1 = v => v.toFixed(1);
const arc = (a, b, r) => { if (b - a >= 23.99) b = a + 23.99; const [x1, y1] = P(a, r), [x2, y2] = P(b, r);
  return `M${f1(x1)},${f1(y1)}A${r},${r} 0 ${b - a > 12 ? 1 : 0} 1 ${f1(x2)},${f1(y2)}` };
// the same arc drawn the other way: labels on the bottom half use it so the text stays upright
const arcRev = (a, b, r) => { const [x1, y1] = P(b, r), [x2, y2] = P(a, r); return `M${f1(x1)},${f1(y1)}A${r},${r} 0 ${b - a > 12 ? 1 : 0} 0 ${f1(x2)},${f1(y2)}` };
const bottom = (a, b) => { const m = ((a + b) / 2) % 24; return m > 18 || m < 6 };

// one rim item = arc + label along it + a wide invisible hit path
function rimItem(id, a, b, color, ink, label, aria, opt = {}) {
  if (b - a < 0.05) return '';
  const len = R_RIM * (b - a) / 24 * 2 * Math.PI, n = Math.floor((len - 10) / 6.3), sel = SEL === id;
  let s = `<g data-sel="${id}"><path class="arc${sel ? ' sel' : ''}" d="${arc(a, b, R_RIM)}" stroke="${color}" stroke-width="${sel ? RIM_W + 6 : RIM_W}" fill="none" opacity="${sel ? 1 : opt.op ?? 1}"/>`;
  if (n >= 3) s += `<path id="lp-${id}" d="${bottom(a, b) ? arcRev(a, b, R_RIM) : arc(a, b, R_RIM)}" fill="none"/><text class="lbl" fill="${ink}" dy="4"><textPath href="#lp-${id}" startOffset="50%" text-anchor="middle">${esc(clip(label, n))}</textPath></text>`;
  return s + `<path class="hit" d="${arc(a, b, R_RIM)}" stroke-width="44" role="button" tabindex="0" aria-label="${esc(aria)}"/></g>`;
}

/* ---------- render ---------- */
function render() {
  if (!RAW) return;
  const M = model(OFF), CR = 'oklch(0.97 0.025 90)', PE = 'oklch(0.8 0.1 48)', DEEP = 'oklch(0.15 0.04 180)', INK = 'oklch(0.22 0.05 178)';
  // header
  $('h-day').textContent = `${M.wd} ${M.date.getDate()}`;
  $('h-sub').textContent = `${M.md} · ${OFF ? 'tomorrow' : M.clock}${M.lo !== null ? ` · ${M.lo}–${M.hi}°` : ''}`;
  $('h-t').innerHTML = M.nowT !== null ? `${M.nowT}<span>°</span>` : M.hi !== null ? `${M.hi}<span>°</span>` : '';
  $('h-sun').textContent = `sunset ${t12(M.set)}`;
  document.querySelectorAll('[data-off]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.off === OFF));

  let s = `<defs>
    <radialGradient id="g-core"><stop offset="0" stop-color="oklch(0.86 0.085 60)"/><stop offset=".65" stop-color="oklch(0.8 0.1 48)"/><stop offset="1" stop-color="oklch(0.75 0.1 72)"/></radialGradient>
    <radialGradient id="g-halo"><stop offset=".45" stop-color="oklch(0.79 0.1 45)" stop-opacity=".5"/><stop offset="1" stop-color="oklch(0.68 0.11 120)" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
  // stone: night half deep green, daylight sector teal
  const RI = R_RIM - RIM_W / 2;
  s += `<circle cx="${C}" cy="${C}" r="${RI}" fill="oklch(0.22 0.05 178)"/><path d="${arc(M.rise, M.set, RI)}L${C},${C}Z" fill="oklch(0.35 0.075 172)"/>`;
  s += `<circle cx="${C}" cy="${C}" r="${R_RIM}" fill="none" stroke="${CR}" stroke-opacity=".07" stroke-width="${RIM_W}"/>`;
  // hour ticks + numerals + sunrise/sunset ticks
  for (let x = 0; x < 24; x++) { const [x1, y1] = P(x, x % 6 ? 152 : 146), [x2, y2] = P(x, 160); s += `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${CR}" stroke-opacity="${x % 6 ? .18 : .4}"/>` }
  [[0, '12A'], [6, '6A'], [12, '12P'], [18, '6P']].forEach(([x, t]) => { const [a, b] = P(x, 136); s += `<text class="num" x="${f1(a)}" y="${f1(b + 3.5)}" text-anchor="middle">${t}</text>` });
  [M.rise, M.set].forEach(x => { const [a, b] = P(x, 146), [c2, d2] = P(x, 162); s += `<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(c2)}" y2="${f1(d2)}" stroke="var(--glow)" stroke-width="2"/>` });
  // gnomon shadow: points at now, longer as the sun gets lower; moon at night
  if (M.nowH !== null) { const e = M.elev(M.nowH);
    if (e > 0) { const len = 112 + (1 - e) * 46, [tx, ty] = P(M.nowH, len), [lx, ly] = P(M.nowH - .75, 84), [rx, ry] = P(M.nowH + .75, 84);
      s += `<path d="M${f1(lx)},${f1(ly)}L${f1(tx)},${f1(ty)}L${f1(rx)},${f1(ry)}Z" fill="${DEEP}" opacity=".7" filter="url(#soft)"/>` }
    else { const [mx, my] = P(M.nowH, 146); s += `<circle cx="${f1(mx)}" cy="${f1(my)}" r="7" fill="${CR}"/>` } }
  // activity: one dot per hour (size = minutes); tap for the hour's split
  M.hours.forEach((v, i) => { if (!(v.f + v.d + v.m)) return; const id = 'h' + i, sel = SEL === id ? ' sel' : '';
    s += `<g data-sel="${id}">`;
    if (v.f) { const [x, y] = P(i + .5, 120); s += `<circle class="dot${sel}" cx="${f1(x)}" cy="${f1(y)}" r="${f1(2.2 + v.f / 60 * 8)}" fill="${CR}"/>` }
    if (v.d) { const [x, y] = P(i + .5, 106); s += `<circle class="dot${sel}" cx="${f1(x)}" cy="${f1(y)}" r="${f1(2.2 + v.d / 60 * 8)}" fill="var(--coral)"/>` }
    if (v.m) { const [x, y] = P(i + .5, 132); s += `<circle class="dot${sel}" cx="${f1(x)}" cy="${f1(y)}" r="2.6" fill="var(--sky)"/>` }
    const [hx, hy] = P(i + .5, 119); s += `<circle class="hitdot" cx="${f1(hx)}" cy="${f1(hy)}" r="15" role="button" tabindex="0" aria-label="${t12(i)}: ${Math.round(v.f)} minutes of work"/></g>` });
  // rim: sleep, tonight's bed, events
  if (M.sleep) s += rimItem('sleep', M.sleep.a, M.sleep.b, 'var(--lav)', INK, `Sleep ${dur(M.sleep.min || 0)}`, `Sleep ${dur(M.sleep.min || 0)}, score ${M.sleep.score ?? 'none'}`);
  if (M.plan) s += rimItem('plan', M.plan.a, M.plan.b, 'var(--lav)', CR, OFF ? `Sleep · wake ${M.plan.wake !== null ? t12(M.plan.wake) : ''}` : 'Bed', `Bedtime ${t12(M.plan.bed)}`, {op: .45});
  M.timed.forEach(e => s += rimItem(e.id, e.a, e.b, e.now ? PE : CR, INK, e.title, `${e.title}, ${t12(e.a)} to ${t12(e.b)}`, {op: e.plan ? .55 : e.done ? .5 : 1}));
  // unlock ring around the core (today): fills toward the focus goal
  if (!OFF) { const p = Math.min(1, M.focus.min / M.focus.goal);
    s += `<circle cx="${C}" cy="${C}" r="96" fill="none" stroke="${CR}" stroke-opacity=".14" stroke-width="5"/>`;
    if (p > 0) s += `<path d="${p >= 1 ? `M${C},${C - 96}a96,96 0 1 1 -.1,0` : arc(12, 12 + p * 24, 96)}" fill="none" stroke="var(--glow)" stroke-width="5" stroke-linecap="round"/>`; }
  // the peach core (the desk's)
  s += `<circle cx="${C}" cy="${C}" r="128" fill="url(#g-halo)" pointer-events="none"/><circle cx="${C}" cy="${C}" r="88" fill="url(#g-core)"/>`;
  // now marker across the rim
  if (M.nowH !== null) { const [a, b] = P(M.nowH, R_RIM + RIM_W / 2 + 1), [c2, d2] = P(M.nowH, R_RIM + RIM_W / 2 + 7), [gx, gy] = P(M.nowH, R_RIM + RIM_W / 2 + 11);
    s += `<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(c2)}" y2="${f1(d2)}" stroke="var(--glow)" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/><circle cx="${f1(gx)}" cy="${f1(gy)}" r="4.5" fill="var(--glow)"/>` }
  const svg = $('svg'); svg.innerHTML = s; svg.classList.toggle('dim', !!SEL);
  $('core').innerHTML = core(M);
  $('stats').innerHTML = stats(M);
}

// the center: the tapped item, or (default) what's happening now + the unlock
function core(M) {
  const until = ms => dur(ms / 6e4), back = '<div class="back">tap to go back</div>';
  if (SEL) {
    const e = M.timed.find(x => x.id === SEL);
    if (e) { const span = `${t12(e.a)}–${t12(e.b)} · ${dur((e.end - e.start) / 6e4)}${e.where ? ' · ' + esc(e.where) : ''}`;
      if (e.now) return `<div class="t">${esc(e.title)}</div><div class="big">${hm((e.end - M.now) / 6e4)}<small>left</small></div><div class="s">${span}</div>${back}`;
      if (e.done) return `<div class="t">${esc(e.title)}</div><div class="big">Done</div><div class="s">${span}<br>ended ${until(M.now - e.end)} ago</div>${back}`;
      return `<div class="t">${esc(e.title)}</div><div class="big">${OFF ? t12(e.a) : hm((e.start - M.now) / 6e4)}</div><div class="s">${OFF ? '' : 'until it starts<br>'}${span}</div>${back}` }
    if (SEL === 'sleep' && M.sleep) return `<div class="t">Last night</div><div class="big">${dur(M.sleep.min || 0)}</div><div class="s">${t12(M.sleep.a)}–${t12(M.sleep.b)}<br>sleep score ${M.sleep.score ?? '–'}</div>${back}`;
    if (SEL === 'plan' && M.plan) return `<div class="t">Bedtime</div><div class="big">${t12(M.plan.bed)}</div><div class="s">${OFF ? '' : 'in ' + until((M.plan.bed - M.nowH) * HR) + '<br>'}wake ${M.plan.wake !== null ? t12(M.plan.wake) : '–'}</div>${back}`;
    if (SEL[0] === 'h') { const v = M.hours[+SEL.slice(1)], i = +SEL.slice(1);
      return `<div class="t">${t12(i)} to ${t12(i + 1)}</div><div class="big">${Math.round(v.f)}<small>min work</small></div><div class="s">${Math.round(v.d)}m social · ${Math.round(v.m)}m moving</div>${back}` }
    SEL = null;
  }
  const unlock = M.focus.unlocked ? 'Games unlocked' : `Unlock in ${hm(M.focus.left)}`;
  if (OFF) { const first = M.timed[0];
    return `<div class="t">${first ? 'First up · ' + esc(first.title) : 'Nothing planned'}</div><div class="big">${first ? t12(first.a) : '–'}</div>
      <div class="s">${M.plan && M.plan.wake !== null ? 'wake ' + t12(M.plan.wake) : ''}${M.hi !== null ? ` · high ${M.hi}°` : ''}</div>` }
  if (M.cur) return `<div class="t">${esc(M.cur.title)}</div><div class="big">${hm((M.cur.end - M.now) / 6e4)}<small>left</small></div>
    <div class="s">ends ${t12(M.h(M.cur.end))}${M.next ? `<br>then ${esc(clip(M.next.title, 18))} ${t12(M.next.a)}` : ''}</div><div class="rule"></div><div class="u">${unlock}</div>`;
  if (M.next) return `<div class="t">Next · ${esc(M.next.title)}</div><div class="big">${hm((M.next.start - M.now) / 6e4)}</div>
    <div class="s">at ${t12(M.next.a)}</div><div class="rule"></div><div class="u">${unlock}</div>`;
  return `<div class="t">Free${M.plan ? ' until bed' : ''}</div><div class="big">${M.plan ? until((M.plan.bed - M.nowH) * HR) : '–'}</div>
    <div class="s">${M.plan ? 'bed ' + t12(M.plan.bed) : ''}</div><div class="rule"></div><div class="u">${unlock}</div>`;
}

function stats(M) {
  const cell = (k, v, sub = '') => `<div><small>${k}</small><b>${v}${sub ? `<i>${sub}</i>` : ''}</b></div>`;
  if (OFF) return cell('Bed', M.plan ? t12(M.plan.bed) : '–') + cell('Wake', M.plan && M.plan.wake !== null ? t12(M.plan.wake) : '–') + cell('High', M.hi !== null ? M.hi + '<span style="font-family:var(--sans)">°</span>' : '–');
  return cell('Focus', `${M.focus.min}`, `/ ${M.focus.goal}`) +
    cell('Sleep', M.sleep && M.sleep.score != null ? String(M.sleep.score) : '–', M.sleep ? dur(M.sleep.min || 0) : '') +
    cell('Bed', M.plan ? t12(M.plan.bed) : '–');
}

/* ---------- interaction ---------- */
const pick = t => { const g = t.closest && t.closest('[data-sel]'); SEL = g ? (SEL === g.dataset.sel ? null : g.dataset.sel) : null; render() };
$('svg').addEventListener('click', e => pick(e.target));
$('svg').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target) } });
$('core').onclick = () => { if (SEL) { SEL = null; render() } };
$('stage').addEventListener('click', e => { if (e.target === $('stage') && SEL) { SEL = null; render() } });
document.querySelectorAll('[data-off]').forEach(b => b.onclick = () => { OFF = +b.dataset.off; SEL = null; render() });
// swipe sideways on the dial = change day
{ let x0 = null, y0 = 0; const st = $('stage');
  st.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY });
  st.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) { const o = dx < 0 ? 1 : 0; if (o !== OFF) { OFF = o; SEL = null; render() } } }); }

/* ---------- data ---------- */
// film grain, generated once (same recipe as the desk)
try { const c = document.createElement('canvas'); c.width = c.height = 150; const x = c.getContext('2d'), g = x.createImageData(150, 150);
  for (let i = 0; i < g.data.length; i += 4) { const v = Math.random() * 255; g.data[i] = g.data[i + 1] = g.data[i + 2] = v; g.data[i + 3] = 255 }
  x.putImageData(g, 0, 0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`) } catch {}

async function weather() {
  try { const c = JSON.parse(sessionStorage.getItem('fg_wx') || 'null'); if (c && Date.now() - c.at < 18e5) return c.v } catch {}
  try { const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.02&longitude=-118.29&hourly=temperature_2m&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min&current=temperature_2m&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=3');
    const v = await r.json(); try { sessionStorage.setItem('fg_wx', JSON.stringify({at: Date.now(), v})) } catch {} return v } catch { return null }
}
function showLogin(m) { $('login').hidden = false; $('lerr').textContent = m || ''; $('key').focus() }
$('loginForm').onsubmit = e => { e.preventDefault(); sset('tj_focus_key', $('key').value); $('login').hidden = true; load() };
async function load() {
  try {
    const wx = weather(); let r;
    if (LOCAL) r = await fetch('/api/today', {cache: 'no-store'});
    else { const k = sget('tj_focus_key'); if (!k) return showLogin();
      r = await fetch('/api/focus', {headers: {'x-key': k}, cache: 'no-store'});
      if (r.status === 401) { try { store.removeItem('tj_focus_key') } catch {} return showLogin('That key didn’t work.') }
      if (r.status === 429) throw new Error('locked for 15 min') }
    if (!r.ok) throw new Error(r.status);
    RAW = await r.json(); WX = await wx; $('msg').textContent = ''; render();
  } catch (e) { $('msg').textContent = 'Can’t reach the desk (' + e.message + ')' }
}
load();
setInterval(() => document.visibilityState === 'visible' && load(), 60000);
setInterval(() => document.visibilityState === 'visible' && render(), 20000);   // countdowns tick between loads
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
</script>
</body>
