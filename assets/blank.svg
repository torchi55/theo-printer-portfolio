<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#0a0c0e"/>

  <!-- grid lines -->
  <g stroke="#c8860a" stroke-width="0.4" opacity="0.12">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="420" x2="600" y2="420"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="120" y1="0" x2="120" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
  </g>

  <!-- border frame -->
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#c8860a" stroke-width="1" opacity="0.3"/>
  <rect x="50" y="50" width="500" height="500" fill="none" stroke="#c8860a" stroke-width="0.5" opacity="0.15"/>

  <!-- corner markers -->
  <g stroke="#c8860a" stroke-width="1.5" opacity="0.6">
    <line x1="40" y1="40" x2="68" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="68"/>
    <line x1="560" y1="40" x2="532" y2="40"/>
    <line x1="560" y1="40" x2="560" y2="68"/>
    <line x1="40" y1="560" x2="68" y2="560"/>
    <line x1="40" y1="560" x2="40" y2="532"/>
    <line x1="560" y1="560" x2="532" y2="560"/>
    <line x1="560" y1="560" x2="560" y2="532"/>
  </g>

  <!-- horizontal rule top -->
  <line x1="80" y1="190" x2="520" y2="190" stroke="#c8860a" stroke-width="0.6" opacity="0.35"/>

  <!-- BLANK label -->
  <text x="300" y="282" font-family="Michroma, 'Arial Narrow', sans-serif"
        font-size="72" font-weight="400" letter-spacing="0.18em"
        text-anchor="middle" fill="#d89a18" opacity="0.9">BLANK</text>

  <!-- horizontal rule bottom -->
  <line x1="80" y1="318" x2="520" y2="318" stroke="#c8860a" stroke-width="0.6" opacity="0.35"/>

  <!-- status label -->
  <text x="300" y="160" font-family="Michroma, 'Arial Narrow', sans-serif"
        font-size="11" letter-spacing="0.28em"
        text-anchor="middle" fill="#c8860a" opacity="0.45">PROJECT · FILE</text>

  <!-- coming soon -->
  <text x="300" y="365" font-family="Michroma, 'Arial Narrow', sans-serif"
        font-size="13" letter-spacing="0.32em"
        text-anchor="middle" fill="#c8860a" opacity="0.5">COMING SOON</text>

  <!-- bottom serial -->
  <text x="300" y="520" font-family="Michroma, 'Arial Narrow', sans-serif"
        font-size="9" letter-spacing="0.2em"
        text-anchor="middle" fill="#c8860a" opacity="0.22">TJ · 2026 · UNDISCLOSED</text>

  <!-- scanline overlay effect -->
  <rect width="600" height="600" fill="url(#scanlines)" opacity="0.08"/>
  <defs>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#000"/>
    </pattern>
  </defs>
</svg>
