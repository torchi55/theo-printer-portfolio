<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Theo OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Michroma&family=Doto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Theo OS v3 "widgets": black canvas, glowing gradient widgets, dot-matrix numerals. Visual first, numbers second.
   Reads /api/os, /api/today, /api/money, /api/brief, /api/calendar from gate.py. Variable names kept from v2 so shared CSS works. */
:root{
  --bg:#050506; --bar:#0c0c0e; --surf:#111114; --surf-2:#1a1a1f; --line:oklch(1 0 0 / .09); --line-2:oklch(1 0 0 / .17);
  --ink:#f4f1ea; --ink-2:oklch(0.97 0.02 90 / .74); --ink-3:oklch(0.97 0.02 90 / .5);
  --peach:#e8ff3a; --on-light:#0b0b0c;
  --bad:#ff6b5e; --good:#6fe3a0; --lav:#b79bff;
  --k-school:#7fd4e0; --k-meal:#ffd166; --k-work:#f4f1ea; --k-workout:#8be28b; --k-call:#e58bd0; --k-due:var(--bad);
  --sans:'Geist',ui-sans-serif,-apple-system,system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --disp:'Michroma','Eurostile',ui-sans-serif,sans-serif; --dot:'Doto','Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1); --r:12px; --gap:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body{min-height:100dvh;color:var(--ink);font:14px/1.4 var(--sans);font-feature-settings:'tnum';-webkit-tap-highlight-color:transparent;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--peach);outline-offset:2px;border-radius:6px}
.ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono)}
.lbl{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* shell */
main{max-width:640px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
.bar{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:60px;max-width:616px;margin:0 auto;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:22px;background:oklch(0.16 0 0 / .86);backdrop-filter:blur(18px);border:1px solid var(--line-2)}
.bar button{display:grid;place-content:center;justify-items:center;gap:4px;color:var(--ink-3);font:500 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;border-radius:18px;position:relative}
.bar button[aria-current=page]{color:var(--peach)}
.bar .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--peach);color:var(--on-light);font:600 10px/16px var(--mono);text-align:center}
.bar .badge[hidden]{display:none}
@media(min-width:900px){
  main{max-width:none;margin:0 0 0 100px;padding:0 24px 40px 14px}
  .bar{left:14px;top:14px;bottom:14px;right:auto;width:72px;height:auto;margin:0;grid-auto-flow:row;grid-template-columns:1fr;grid-auto-rows:72px;align-content:start;padding-top:8px;border-radius:24px}
  .bar .badge{left:calc(50% + 8px)}
}
.view[hidden]{display:none}

/* capture bar */
.cap{position:sticky;top:0;z-index:15;margin:0 -12px;padding:max(10px,env(safe-area-inset-top)) 12px 8px;background:linear-gradient(var(--bg) 72%,transparent)}
@media(min-width:900px){.cap{margin:0 -24px 0 -14px;padding:14px 24px 10px 14px}.cap form{max-width:760px}}
.cap form{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 16px;border:1px solid var(--line-2);border-radius:999px;background:oklch(0.17 0 0 / .9);transition:border-color .16s var(--ease)}
.cap form:focus-within{border-color:var(--peach)}
.cap .pr{font:500 13px var(--mono);color:var(--peach)}
.cap input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--ink);font:400 15px var(--sans)}
.cap input::placeholder{color:var(--ink-3)}
.cap .go{height:34px;padding:0 16px;border-radius:999px;background:var(--peach);color:var(--on-light);font:600 12px var(--mono);letter-spacing:.04em}
.cap .go:disabled{opacity:.25;cursor:default}

/* header */
.vh{display:flex;align-items:baseline;gap:12px;padding:10px 4px 12px}
.vh h1{font:400 18px/1.1 var(--disp);letter-spacing:.01em}
.vh p{margin-left:auto;font:400 12px var(--mono);color:var(--ink-3);white-space:nowrap}

/* ---------- WIDGET GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);grid-auto-flow:dense}
.w{position:relative;border-radius:26px;overflow:hidden;min-height:170px;padding:16px;display:flex;flex-direction:column;isolation:isolate;
  color:#fff;border:1px solid oklch(1 0 0 / .13);background:var(--g,var(--surf));box-shadow:0 18px 40px -22px var(--glow,transparent)}
.w::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;mix-blend-mode:soft-light;
  background-image:radial-gradient(oklch(1 0 0 / .55) .7px,transparent .8px);background-size:5px 5px}
.w .wt{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:oklch(1 0 0 / .78)}
.w .wt .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11.5px}
.w .big{font:700 clamp(38px,4.4vw,52px)/1 var(--dot);white-space:nowrap;letter-spacing:-.01em;margin:auto 0 4px;text-shadow:0 0 28px oklch(1 0 0 / .35)}
.w .big small{font:500 13px var(--mono);letter-spacing:0;margin-left:5px;opacity:.75}
.w .sub{font:400 12px/1.35 var(--mono);color:oklch(1 0 0 / .82)}
/* hover coach: slides up over the widget */
.coach{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;padding:11px 13px;border-radius:18px;background:oklch(0.12 0 0 / .88);backdrop-filter:blur(14px);border:1px solid var(--line-2);
  font:400 12.5px/1.45 var(--sans);color:var(--ink);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.coach b{display:block;font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--peach);margin-bottom:5px}
.w:hover .coach,.w:focus-within .coach,.w.tap .coach{opacity:1;transform:none}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.w.c2{grid-column:span 2}.w.c3{grid-column:span 3}.w.c4{grid-column:span 4}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(12,minmax(0,1fr))}.w{grid-column:span 3}.w.c2{grid-column:span 4}.w.c3{grid-column:span 5}.w.c4{grid-column:span 8}.w.c6{grid-column:span 6}
  .w.tall{grid-row:span 2}}
@media(max-width:619px){.w.c2,.w.c3,.w.c4{grid-column:span 2}}

/* widget flavours (gradients borrowed from the reference palette) */
.w.brief{--g:radial-gradient(120% 140% at 15% 0%,#c77dff 0%,transparent 45%),radial-gradient(90% 120% at 100% 100%,#ff7a59 0%,transparent 50%),linear-gradient(160deg,#2a1b6b,#111);--glow:#9b5cff55;min-height:200px}
.w.brief .txt{font:400 19px/1.45 var(--sans);letter-spacing:-.005em;margin:auto 0 0;text-wrap:pretty;max-width:52ch}
.w.brief .txt.busy{opacity:.7}
.w.brief .by{margin-top:10px;font:400 11px var(--mono);color:oklch(1 0 0 / .6)}
.w.sleep{--g:linear-gradient(165deg,#ff4f8b 0%,#8b3dff 55%,#2a1d6e 100%);--glow:#ff4f8b55}
.w.focus{--g:linear-gradient(165deg,#ffb347 0%,#ff4d4d 55%,#7a1230 100%);--glow:#ff4d4d55}
.w.body{--g:linear-gradient(165deg,#c8ff6e 0%,#21c58a 50%,#07483f 100%);--glow:#21c58a55;color:#04281f}
.w.body .wt,.w.body .sub{color:oklch(0.2 0.05 170 / .85)}.w.body .big{text-shadow:none}
.w.habit{--g:linear-gradient(165deg,#7fd4ff 0%,#3d6bff 55%,#101a5c 100%);--glow:#3d6bff55}
.w.spend{--g:linear-gradient(165deg,#3ea0ff 0%,#1b3dd6 50%,#080d3a 100%);--glow:#2a5bff66}
.w.todo{--g:linear-gradient(170deg,#1b1b20,#0b0b0d)}
.w.sched{--g:linear-gradient(170deg,#22343a,#0b1214);--glow:#2aa6b355}
.w.inboxw{--g:linear-gradient(160deg,#e8ff3a 0%,#9ad600 100%);color:#10120a;cursor:pointer}
.w.inboxw .wt,.w.inboxw .sub{color:oklch(0.25 0.06 120 / .85)}.w.inboxw .big{text-shadow:none}
.w.intake{--g:linear-gradient(165deg,#5ff2d4 0%,#1f8fff 52%,#0b1640 100%);--glow:#1f8fff55}
.iks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto;padding-top:10px}
.ik{position:relative;display:grid;justify-items:center;gap:2px;text-align:center}
.ib{position:relative;width:min(84px,100%);aspect-ratio:1;border-radius:50%;background:oklch(0 0 0 / .22);display:grid;place-items:center;transition:transform .12s var(--ease)}
.ib:active{transform:scale(.92)}.ib:hover .ii{transform:translateY(-2px) rotate(-4deg)}
.iring{position:absolute;inset:0;transform:rotate(-90deg)}.iring circle{fill:none;stroke-width:2.6}.iring .t{stroke:oklch(1 0 0 / .18)}
.iring .p{stroke:#fff;stroke-linecap:round;stroke-dasharray:var(--d) 100;transition:stroke-dasharray .4s var(--ease)}
.ik.full .iring .p{stroke:#ffd23a}.ik.over .iring .p{stroke:#ff5a5a}.ik.goal .iring .p{stroke:#c8ff6e}.ik.over .ib{background:oklch(0.45 0.18 25 / .45)}
.ii{width:62%;height:62%;display:grid;place-items:center;transition:transform .2s var(--ease)}.ii svg,.ii img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px #0006)}
.in{position:absolute;right:2px;bottom:2px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#fff;color:#0b1640;font:700 13px/24px var(--mono)}
.il{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}.is{font:400 11px var(--mono);color:oklch(1 0 0 / .8)}
.iu{position:absolute;left:4px;top:0;width:24px;height:24px;border-radius:12px;background:oklch(0 0 0 / .35);color:#fff;font:600 15px/22px var(--mono);opacity:.55}.iu:hover{opacity:1}
.w.intake .xp{font-weight:700;color:#c8ff6e}
.w.intake.party{animation:party 1.6s var(--ease)}
@keyframes party{0%{box-shadow:0 0 0 0 #c8ff6e}20%{box-shadow:0 0 0 6px #c8ff6e,0 0 60px 10px #c8ff6e88;transform:scale(1.02)}100%{box-shadow:0 18px 40px -22px var(--glow);transform:none}}
.w.music{--g:linear-gradient(160deg,#2b2b30,#0c0c0e)}
.stg{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 6px}
.stg i{display:block;height:100%;flex:var(--f);background:var(--c);min-width:3px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:400 10.5px var(--mono);color:oklch(1 0 0 / .8)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px}
.hours{display:flex;align-items:flex-end;gap:3px;height:48px;margin:10px 0 4px}
.hours i{flex:1;background:#fff;opacity:.9;border-radius:3px 3px 0 0;height:var(--h);min-height:3px}
.hours i.z{background:oklch(1 0 0 / .25)}
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;min-width:0;margin:auto 0 0;align-items:end}
.ringc{text-align:center;flex:1}
.ringc svg{width:min(62px,100%);aspect-ratio:1;height:auto;transform:rotate(-90deg)}
.ringc circle{fill:none;stroke-width:5}
.ringc .t{stroke:oklch(1 0 0 / .22)}.ringc .p{stroke:#fff;stroke-linecap:round;stroke-dasharray:var(--d) 100}
.ringc b{display:block;font:500 11px var(--mono);margin-top:4px}.ringc span{font:400 10.5px var(--mono);opacity:.8}
.pool{display:grid;gap:7px;margin-top:12px}
.pool .pr{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font:400 11.5px var(--mono)}
.pool .tk{height:6px;border-radius:3px;background:oklch(1 0 0 / .2);overflow:hidden}.pool .tk i{display:block;height:100%;width:var(--w);background:#fff;border-radius:3px}
.pool .pr.stop .tk i{background:var(--bad)}.pool .pr.stop b{color:#ffb4ab}
.pool .pr b{font-weight:600}
/* errands: click a line to delete it */
.todo .lst{margin:10px -6px 0;display:flex;flex-direction:column;overflow:auto;max-height:430px;scrollbar-width:thin}
.todo .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:12px;font:400 14px/1.3 var(--sans);color:var(--ink);transition:background .14s,opacity .2s,transform .2s var(--ease)}
.todo .it:hover{background:oklch(1 0 0 / .07)}
.todo .it .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;position:relative}
.todo .it:hover .ck{border-color:var(--bad)}.todo .it:hover .ck::after{content:'×';position:absolute;inset:0;display:grid;place-content:center;font:600 13px/1 var(--mono);color:var(--bad)}
.todo .it small{display:block;font:400 10.5px var(--mono);color:var(--ink-3);margin-top:2px}
.todo .it.later{opacity:.55}
.todo .it.gone{opacity:0;transform:translateX(30px);pointer-events:none}
.todo .it .lt{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink-3);padding:4px 7px;border-radius:7px;opacity:0}
.todo .it:hover .lt{opacity:1}.todo .it .lt:hover{background:var(--surf-2);color:var(--ink)}
.sch .ev2{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:8px 0;border-top:1px solid oklch(1 0 0 / .14);font-size:13px}
.sch .ev2:first-of-type{border-top:0}.sch .ev2 .tm{font:400 11.5px var(--mono);color:oklch(1 0 0 / .65)}
.sch .ev2.now{color:var(--peach)}.sch .ev2 small{display:block;font:400 11px var(--mono);opacity:.7}
.sch .more{margin-top:auto;font:500 11px var(--mono);color:var(--peach);padding-top:8px;text-align:left}

/* ---------- CALENDAR ---------- */
.calnav{display:flex;align-items:center;gap:8px;padding:0 4px 10px}
.calnav button{height:34px;min-width:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font:500 12px var(--mono);color:var(--ink-2)}
.calnav button:hover{background:var(--surf-2)}.calnav .ttl{font:500 16px var(--sans);margin-left:6px}
.cal{border:1px solid var(--line);border-radius:20px;background:var(--surf);overflow:auto;max-height:calc(100dvh - 200px)}
.calh,.calb,.calad{display:grid;grid-template-columns:44px repeat(7,minmax(70px,1fr))}
.calh{position:sticky;top:0;z-index:4;background:var(--surf);border-bottom:1px solid var(--line)}
.calh div{padding:8px 6px;text-align:center;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.calh div b{display:block;font:400 20px/1.2 var(--sans);letter-spacing:0;color:var(--ink);text-transform:none}
.calh div.today b{display:inline-grid;place-content:center;width:34px;height:34px;border-radius:50%;background:var(--peach);color:var(--on-light)}
.calb{position:relative}.hrs div{height:48px;font:400 10px var(--mono);color:var(--ink-3);padding:0 6px;transform:translateY(-6px);text-align:right}
.dcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 47px,var(--line) 47px 48px)}
.dcol.today{background-color:oklch(1 0 0 / .03)}
.gd,.ce{--g1:color-mix(in oklch,var(--c) 70%,white 30%);--g2:var(--c);--g3:color-mix(in oklch,var(--c) 62%,black 38%);background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%);color:#fff;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 6px 16px -10px var(--c)}
.gd::before,.ce::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;mix-blend-mode:soft-light;background-image:radial-gradient(oklch(1 0 0 / .7) .6px,transparent .75px);background-size:4px 4px}
.ce{position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 8px;font:600 11.5px/1.25 var(--sans);text-shadow:0 1px 2px oklch(0 0 0 / .35);border:1px solid oklch(1 0 0 / .22);cursor:grab}
.ce.drag{cursor:grabbing;opacity:.85;z-index:6;box-shadow:0 12px 28px -8px #000}
.ce .rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.ce.pend::after{content:'syncing';position:absolute;right:6px;top:4px;font:500 8px var(--mono);opacity:.8}
.ce small{display:block;font:400 10px var(--mono);opacity:.85;margin-top:2px}
.calad{border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:3;background:var(--surf)}
.adc{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.adc span{font:600 10.5px/1.3 var(--sans);color:#fff;padding:3px 7px;border-radius:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px oklch(0 0 0 / .35)}
.adc span.gd:not(.f){border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-4px;color:transparent;text-shadow:none}
.adc span.gd:not(.l){border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-4px}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}.nowl::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.duebar{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 10px}
.duebar span{font:500 11px var(--mono);padding:5px 9px;border-radius:8px;background:oklch(0.35 0.1 28);color:#ffd2cc}

.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line-2);border-radius:20px;margin-top:10px}
.empty b{display:block;font:400 15px var(--disp);margin-bottom:8px}.empty p{color:var(--ink-3);font:400 12.5px var(--mono)}
.empty button{margin-top:18px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;font:500 12px var(--mono);color:var(--ink-2)}
.next{margin-top:14px;padding:0 2px}
.next .row{grid-template-columns:minmax(0,1fr) auto}
.next .row .tx{color:var(--ink-2);font-size:13px}.row .vl{font:500 12px var(--mono);color:var(--ink-2);text-align:right}
.pn{border:1px solid var(--line);border-radius:16px;background:var(--surf);margin-top:var(--gap);overflow:hidden}
.pn>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.pn>summary::-webkit-details-marker{display:none}
.pn .bd{border-top:1px solid var(--line);padding:4px 14px 12px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row .tm{font:400 12px var(--mono);color:var(--ink-3)}.row .tx{overflow-wrap:anywhere}
.proto{margin:26px 0 0;padding:10px 12px;border:1px dashed var(--line-2);border-radius:var(--r);font:400 11.5px/1.5 var(--mono);color:var(--ink-3)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;
  padding:10px 14px;border-radius:999px;background:var(--ink);color:var(--on-light);font:500 12px var(--mono);transition:all .22s var(--ease);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:28px}}
.toast.show:has(button){pointer-events:auto}.toast button{margin-left:12px;color:#5b6a00;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* tile detail sheet */
.w[data-d]{cursor:pointer}
.w[data-d]:hover{border-color:oklch(1 0 0 / .35)}
#detail{position:fixed;inset:0;z-index:40;display:none;background:oklch(0 0 0 / .66);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
#detail.on{display:flex}
.dsheet{width:min(720px,100%);max-height:88dvh;overflow:auto;background:var(--surf);border:1px solid var(--line-2);border-radius:26px 26px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:900px){#detail{align-items:center}.dsheet{border-radius:26px;padding-bottom:24px}}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.dh button{width:34px;height:34px;border-radius:50%;background:var(--surf-2);font-size:20px;line-height:1}
.dsheet h2{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.chart{width:100%;height:150px;display:block}
.clab{display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--ink-3);margin-top:2px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.st{border:1px solid var(--line);border-radius:14px;padding:10px 12px}.st b{display:block;font:600 20px/1.1 var(--sans);margin-top:7px}
.tk2{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin:-2px 0 6px}.tk2 i{display:block;height:100%}
.dcol{touch-action:pan-y}.ce{touch-action:pan-y;-webkit-touch-callout:none;user-select:none}
.fm{display:grid;gap:10px;margin-top:6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow .sx{display:grid;gap:4px;min-width:0}.srow .sx small{font:400 11px var(--sans);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow input,.srow select{height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surf-2);color:var(--ink);font:400 14px var(--sans);color-scheme:dark;min-width:0}
.srow select{grid-column:1}.srow .send{height:36px;padding:0 16px;border-radius:10px;background:var(--peach);color:var(--on-light);font:600 12px var(--mono)}.srow .vl{font:500 12px var(--mono);color:var(--ink-2)}
.lnk{color:var(--peach);font:inherit;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.fm input,.fm select{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surf-2);color:var(--ink);font:400 15px var(--sans);outline:0;color-scheme:dark}
.fm input:focus,.fm select:focus{border-color:var(--peach)}
.fm label{display:grid;gap:6px}.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fm .two label{gap:6px}
.fm .chk{display:flex;align-items:center;gap:8px;font:400 13px var(--sans);color:var(--ink-2)}.fm .chk input{width:18px;height:18px}
.fm input[hidden]{display:none}
.fm .acts{padding:6px 0 0;grid-template-columns:1fr 2fr}.fm .acts button[hidden]{display:none}
/* health tab */
.hp{min-height:0;grid-column:1/-1;gap:2px}
@media(min-width:1180px){.hp.half{grid-column:span 6}}
.hbig{font:700 clamp(34px,5vw,54px)/1 var(--dot);margin:8px 0 10px;text-shadow:0 0 28px oklch(1 0 0 / .3)}
.hbig small{font:500 12px var(--mono);margin-left:8px;opacity:.75;letter-spacing:0}
.hg{width:100%;height:auto;display:block;margin:4px 0}
.hl{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:oklch(1 0 0 / .72);margin:14px 0 4px}
.hp .clab{color:oklch(1 0 0 / .65)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hyp{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:stretch;margin:4px 0}
.hyp .lanes{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0 22px;font:400 10px var(--mono);color:oklch(1 0 0 / .7)}
.hyp .plot{position:relative}.hyp .tk{position:relative;height:16px;margin-top:2px}.hyp .tk span{position:absolute;transform:translateX(-50%);font:400 10px var(--mono);color:oklch(1 0 0 / .65)}
.stg.tall{height:14px;border-radius:7px;margin:14px 0 8px}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin:10px 0 4px}
.heat i{aspect-ratio:1/1.5;border-radius:4px;background:oklch(1 0 0 / calc(.12 + var(--a) * .85))}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:14px}
.kv{border:1px solid oklch(1 0 0 / .22);border-radius:14px;padding:9px 11px;background:oklch(0 0 0 / .12)}
.kv span{display:block;font:500 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;opacity:.75}.kv b{display:block;font:600 18px/1.1 var(--sans);margin-top:7px}
.w.body.hp .hl,.w.body.hp .kv span,.w.body.hp .clab{color:oklch(0.2 0.05 170 / .8)}
.w.body.hp .hg path[stroke="#fff"]{stroke:#04281f}.w.body.hp .hg circle{fill:#04281f}
.dsheet .more{margin-top:16px;font:500 12px var(--mono);color:var(--peach)}
/* ---- inbox / log / chat (shared from v2) ---- */
/* ---------- INBOX: one card ---------- */
.qhead{display:flex;align-items:center;gap:10px;padding:0 2px;margin-top:2px}
.qdots{display:flex;gap:4px;margin-left:auto}
.qdots i{width:18px;height:3px;border-radius:2px;background:var(--line-2)}
.qdots i.on{background:var(--peach)} .qdots i.done{background:var(--ink-3)}
.card{border:1px solid var(--line-2);border-radius:14px;background:var(--surf);margin-top:10px;overflow:hidden;animation:arrive .32s var(--ease)}
.card.out{animation:leave .24s var(--ease) forwards}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateX(-24px)}}
.card.skip{animation-name:leaveR}@keyframes leaveR{to{opacity:0;transform:translateX(24px)}}
.ch{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.ch .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.kind{height:20px;padding:0 8px;border-radius:5px;font:600 10.5px/20px var(--mono);letter-spacing:.07em;text-transform:uppercase;background:var(--c);color:var(--on-light)}
.ch .age{margin-left:auto;font:400 11.5px var(--mono);color:var(--ink-3)}
.ch h2{font:500 17px/1.3 var(--sans);overflow-wrap:anywhere}
.ch .why{color:var(--ink-2);font-size:13px;margin-top:4px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.meta dt{font:500 10.5px/18px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta dd{overflow-wrap:anywhere;color:var(--ink-2)} .meta dd b{font-weight:500;color:var(--ink)}
.orig{margin:10px 16px 0;padding:8px 10px;border-left:2px solid var(--line-2);color:var(--ink-3);font-size:12.5px;line-height:1.45;max-height:4.4em;overflow:hidden;position:relative}
.edl{display:flex;align-items:center;margin:12px 16px 6px}
.edl .lbl:last-child{margin-left:auto;color:var(--peach)}
textarea.body{display:block;width:calc(100% - 32px);margin:0 16px;min-height:150px;resize:vertical;padding:12px;border-radius:8px;border:1px solid var(--line-2);background:oklch(0.17 0.035 180);
  color:var(--ink);font:400 14px/1.55 var(--sans);outline:0}
textarea.body:focus{border-color:var(--peach)}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:14px 16px 16px}
.acts button{height:46px;border-radius:10px;font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.acts .skip{border:1px solid var(--line-2);color:var(--ink-2)}
.acts .send{background:var(--peach);color:var(--on-light)}
@media(hover:hover){.acts .skip:hover{background:var(--surf-2)}.acts .send:hover{background:oklch(0.83 0.095 52)}}
.acts button:active{transform:scale(.98)}
.safe{padding:0 16px 14px;margin-top:-4px;font:400 11.5px var(--mono);color:var(--ink-3)}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line-2);border-radius:14px;margin-top:10px}
.empty b{display:block;font:400 15px var(--disp);margin-bottom:8px}
.empty p{color:var(--ink-3);font:400 12.5px var(--mono)}
.empty button{margin-top:18px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;font:500 12px var(--mono);color:var(--ink-2)}
.next{margin-top:14px;padding:0 2px}
.next .row{grid-template-columns:minmax(0,1fr) auto}
.next .row .tx{color:var(--ink-2);font-size:13px}

/* ---------- LOG ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;font:500 11.5px var(--mono);color:var(--ink-2);white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--on-light);border-color:var(--ink)}
.dayh{position:sticky;top:78px;padding:10px 2px 6px;background:var(--bg);z-index:2}
@media(min-width:900px){.dayh{top:84px}}
.feed{border-left:1px solid var(--line-2);margin-left:5px}
.ev{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:9px 0 9px 16px}
.ev::before{content:'';position:absolute;left:-4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3));box-shadow:0 0 0 3px var(--bg)}
.ev .tm{font:400 12px var(--mono);color:var(--ink-3);padding-top:1px}
.ev .tx{overflow-wrap:anywhere}
.ev .to{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
.ev .to .arrow{font:400 12px var(--mono);color:var(--ink-3)}
.note-l{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;border:1px solid var(--line-2);font:400 11px var(--mono);color:var(--ink-2)}
.ev.new{animation:arrive .4s var(--ease)}

/* ---------- CHAT ---------- */
.msgs{display:flex;flex-direction:column;gap:10px;padding:6px 0 14px;min-height:30vh}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surf);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;animation:arrive .28s var(--ease)}
.msg.user{align-self:flex-end;background:var(--surf-2);border-color:var(--line-2)}
.msg small{display:block;margin-top:6px;font:400 11px var(--mono);color:var(--ink-3)}
.msg small.cards{color:var(--peach)}
.msg.think{align-self:flex-start;color:var(--ink-3);font:400 12.5px var(--mono)}
.msg.think::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.msg.err{align-self:flex-start;border-color:var(--bad);color:var(--bad);font:400 12.5px var(--mono)}
.chatf{position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surf);transition:border-color .16s var(--ease)}
.chatf:focus-within{border-color:var(--peach)}
.chatf textarea{flex:1;min-width:0;max-height:140px;min-height:34px;resize:none;background:none;border:0;outline:0;color:var(--ink);font:400 15px/1.4 var(--sans);padding:7px 0}
.chatf .go{height:34px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--on-light);font:600 12px var(--mono);letter-spacing:.04em}
.chatf .go:disabled{opacity:.3;cursor:default}
@media(min-width:900px){.chatf{bottom:16px}}

html,body,button,a,input{touch-action:manipulation}   /* no double-tap zoom */
/* ---------- PHONE: liquid-glass swipe nav, Google-style calendar, lighter paint ---------- */
.bar .lens{display:none}
@media(max-width:899px){
  .bar{display:flex;gap:0;padding:5px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    border-radius:30px;border:1px solid oklch(1 0 0 / .24);
    background:linear-gradient(160deg,oklch(1 0 0 / .20),oklch(1 0 0 / .06) 55%,oklch(1 0 0 / .12));
    -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
    box-shadow:inset 0 1px 0 oklch(1 0 0 / .4),inset 0 -1px 0 oklch(0 0 0 / .35),0 14px 34px -10px #000c;
    -webkit-mask-image:none}
  .bar::-webkit-scrollbar{display:none}
  .bar button{flex:0 0 calc((100% - 0px) / 4.6);scroll-snap-align:center;position:relative;z-index:1;border-radius:24px;transition:color .25s var(--ease)}
  .bar button[aria-current=page]{color:#fff}
  .bar .lens{display:block;position:absolute;left:0;top:5px;bottom:5px;width:0;z-index:0;border-radius:24px;pointer-events:none;
    background:linear-gradient(170deg,oklch(1 0 0 / .34),oklch(1 0 0 / .10) 60%,oklch(1 0 0 / .2));
    border:1px solid oklch(1 0 0 / .4);box-shadow:inset 0 1px 0 oklch(1 0 0 / .6),0 6px 16px -6px #000a;transition:transform .42s var(--ease),width .42s var(--ease)}
  .bar button[aria-current=page] .ic{stroke:var(--peach)}
  .bar .badge{top:5px}
  /* calendar: 3 day columns visible, sticky time gutter + header, native two-axis scroll with snap */
  .cal{max-height:calc(100dvh - 252px - env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding-left:40px;touch-action:pan-x pan-y;border-radius:16px}
  .calh,.calb,.calad{grid-template-columns:40px repeat(7,calc((100vw - 24px - 42px) / 3));width:max-content}
  .calh>div:not(:first-child){scroll-snap-align:start}
  .calh>div:first-child,.calad>div:first-child,.hrs{position:sticky;left:0;z-index:7;background:var(--surf)}
  .calh>div:first-child{z-index:8}.hrs div{padding:0 4px;font-size:9.5px}
  .calh div{padding:6px 4px}.calh div b{font-size:18px}
  .ce{touch-action:pan-x pan-y}
  .duebar{font-size:11px}
  .calnav{flex-wrap:wrap;row-gap:8px}.calnav .ttl{margin-left:2px;flex:1 1 100%;order:5}
  .vh p{white-space:normal;text-align:right}
}
.hrs div{height:var(--px,48px)}
.dcol{background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--px,48px) - 1px),var(--line) calc(var(--px,48px) - 1px) var(--px,48px))}
/* lighter paint on touch screens: no blend modes, no per-widget blur, softer shadows */
@media(hover:none),(max-width:899px){
  .w::before,.gd::before,.ce::before{mix-blend-mode:normal;opacity:.16}
  .coach{backdrop-filter:none;-webkit-backdrop-filter:none;background:oklch(0.12 0 0 / .96)}
  #detail{backdrop-filter:none;-webkit-backdrop-filter:none;background:oklch(0 0 0 / .78)}
  .w{box-shadow:none}.gd,.ce{box-shadow:none}
  .w .big{text-shadow:none}
  html{-webkit-tap-highlight-color:transparent}
  body{overflow-x:hidden}
  .w,.vh h1,.w .sub{overflow-wrap:anywhere}
  .w .big{font-size:clamp(30px,9.5vw,42px);white-space:normal;line-height:1.05}
  .w .big small{display:block;margin:5px 0 0;font-size:11.5px}
  .w{padding:14px}
}

/* ---------- CALENDAR strip (all sizes): locked page, scrolls sideways through time ---------- */
body.calv{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
body.calv main{padding-bottom:0}
.cal{height:calc(100dvh - var(--ct,250px) - 100px - env(safe-area-inset-bottom));min-height:200px;max-height:none;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;scroll-padding-left:40px;touch-action:pan-x pan-y;border-radius:16px}
@media(min-width:900px){.cal{height:calc(100dvh - var(--ct,250px) - 24px)}}
.calh,.calb,.calad{display:grid;grid-template-columns:40px repeat(var(--n,7),var(--colw,100px));width:max-content}
.calh>div:not(:first-child){scroll-snap-align:start}
.calh>div:first-child,.calad>div:first-child,.hrs{position:sticky;left:0;z-index:7;background:var(--surf)}
.calh>div:first-child{z-index:8}
.calh{top:0}.calad{top:var(--hh,58px)}
.hrs div{height:var(--px,48px);padding:0 4px;font-size:9.5px}
.calh div{padding:6px 4px;white-space:nowrap}.calh div b{font-size:18px}
.dcol,.ce{touch-action:pan-x pan-y}
.dcol.m1,.adc.m1,.calh .m1{border-left:2px solid var(--line-2)}
.calh .m1{color:var(--peach)}
.ce.ghost{background:linear-gradient(160deg,#f4ff8a,#e8ff3a);color:#0b0b0c;text-shadow:none;pointer-events:none;z-index:9;left:3px;right:3px;width:auto;opacity:.92;box-shadow:0 10px 26px -8px #000}
.ce.ghost::before{display:none}
.calnav{flex-wrap:wrap;row-gap:8px}.calnav .ttl{margin-left:2px;flex:1 1 100%;order:5}
@media(min-width:620px){.calnav .ttl{flex:0 1 auto;order:0;margin-left:10px}}
.duebar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}.duebar::-webkit-scrollbar{display:none}.duebar span{white-space:nowrap;flex:none;max-width:78vw;overflow:hidden;text-overflow:ellipsis}.duebar:empty{display:none}
.vh{padding:6px 4px 8px}
.hgw{position:relative}.hgw .yl{position:absolute;left:2px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font:500 9.5px/1 var(--mono);color:oklch(1 0 0 / .85);pointer-events:none;text-shadow:0 1px 2px #0006}

#cal.panning,#cal.panning *{cursor:grabbing!important;user-select:none}#cal.panning{scroll-snap-type:none!important}
</style>
</head>
<body>

<nav class="bar" aria-label="Sections"><i class="lens" aria-hidden="true"></i>
  <button type="button" data-v="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Today</button>
  <button type="button" data-v="inbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 13.5 6 5.5h12l2.5 8"/><path d="M3.5 13.5v5h17v-5h-5l-1.5 2h-4l-1.5-2z"/></svg>Inbox<span class="badge" id="badge" hidden>0</span></button>
  <button type="button" data-v="health"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>Health</button>
  <button type="button" data-v="cal"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button type="button" data-v="chat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h15v10h-8l-4 3.5v-3.5h-3z"/></svg>Chat</button>
  <button type="button" data-v="log"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5v15M5 7h3M5 12h3M5 17h3"/><path d="M11.5 7H20M11.5 12H20M11.5 17h6"/></svg>Log</button>
</nav>

<main>
  <div class="cap">
    <form id="capf" autocomplete="off">
      <span class="pr" aria-hidden="true">&gt;</span>
      <input id="capi" type="text" enterkeyhint="send" placeholder="Capture anything: a reminder, an idea, a to-do" aria-label="Capture">
      <button class="go" id="capb" type="submit" disabled>ADD</button>
    </form>
  </div>

  <!-- TODAY: widget dashboard -->
  <section class="view" id="v-today" hidden>
    <div class="grid" id="grid"></div>
  </section>

  <!-- HEALTH -->
  <section class="view" id="v-health" hidden>
    <header class="vh"><h1>Health</h1><p id="hl-sub">sleep · focus · body</p></header>
    <div class="grid" id="hgrid"></div>
  </section>

  <!-- INBOX -->
  <section class="view" id="v-inbox" hidden>
    <header class="vh"><h1>Inbox</h1><p id="in-sub"></p></header>
    <div class="qhead"><span class="lbl" id="qpos"></span><div class="qdots" id="qdots"></div></div>
    <div id="stage"></div>
    <div class="next" id="next"></div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="v-cal" hidden>
    <header class="vh"><h1>Calendar</h1><p id="cal-sub"></p></header>

    <div class="duebar" id="cal-due"></div>

      <textarea id="chati" rows="1" enterkeyhint="send" placeholder="Ask Claude about this topic" aria-label="Message"></textarea>

<script>
/* Hosted Theo OS shim (theojaneway.com/os). Injected before os.html's own script by `python hosted.py build`.
   os.html talks to gate.py's /api/os, /api/today, /api/money, /api/capture, /api/inbox/act. Here those calls are answered from
   the site's /api/focus (owner key in x-key; same localStorage key as the old desk page) and taps are queued for the PC. */
(() => {
  const KEY = 'tj_focus_key', rf = window.fetch.bind(window);
  const store = (() => { try { return localStorage; } catch (e) { return null; } })();
  const getKey = () => { try { return store && store.getItem(KEY); } catch (e) { return null; } };
  let snap = null, ver = '', last = 0, inflight = null, loginP = null;
  const online = () => !!(snap && snap.os && Date.now() - snap.os.at < 150000);
  const resp = (o, s) => new Response(JSON.stringify(o), {status: s || 200, headers: {'Content-Type': 'application/json'}});

  function login(msg) {
    if (loginP) return loginP;
    loginP = new Promise(done => {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:99;display:grid;place-content:center;gap:12px;padding:24px;background:oklch(0.14 0.028 188);font:14px var(--mono,monospace);color:#f4efd8;text-align:center';
      d.innerHTML = '<b style="font:400 18px var(--disp,sans-serif)">Theo OS</b><span id="lerr" style="color:#e88;min-height:1.2em"></span>'
        + '<form id="lf" style="display:grid;gap:10px"><input id="lk" type="password" autocomplete="current-password" placeholder="key" aria-label="Key" style="height:46px;padding:0 14px;border-radius:10px;border:1px solid #ffffff44;background:#0006;color:inherit;font:inherit;text-align:center">'
        + '<button style="height:46px;border-radius:10px;background:#f4efd8;color:#123;font:600 13px var(--mono,monospace)">ENTER</button></form>';
      document.body.appendChild(d);
      d.querySelector('#lerr').textContent = msg || '';
      setTimeout(() => d.querySelector('#lk').focus(), 50);
      d.querySelector('#lf').onsubmit = e => {
        e.preventDefault();
        try { store && store.setItem(KEY, d.querySelector('#lk').value); } catch (x) {}
        d.remove(); loginP = null; done();
      };
    });
    return loginP;
  }

  async function pull(force) {
    if (inflight) return inflight;
    if (!force && snap && Date.now() - last < 3000) return;
    inflight = (async () => {
      try {
        for (let n = 0; n < 3; n++) {
          const k = getKey();
          if (!k) { await login(); continue; }
          const r = await rf('/api/focus' + (ver && !force ? '?v=' + encodeURIComponent(ver) : ''), {headers: {'x-key': k}, cache: 'no-store'});
          if (r.status === 401) { try { store.removeItem(KEY); } catch (e) {} await login('That key didn’t work.'); continue; }
          if (r.status === 429) throw new Error('locked for 15 min');
          last = Date.now();
          if (r.status === 204) return;
          if (!r.ok) throw new Error('site ' + r.status);
          snap = await r.json(); ver = snap.ver || ''; return;
        }
      } finally { inflight = null; }
    })();
    return inflight;
  }

  // after os.html renders: tell Theo when a tapped card is waiting on the PC
  function patch(items) {
    const pend = new Set(snap.pending || []);
    const q = items[0], safe = document.querySelector('#card .safe');
    if (q && safe && pend.has('act:' + q.id)) safe.textContent = online() ? 'Sent. Running on your PC…' : 'PC offline, will run when it’s back.';
    const c = document.getElementById('conn');
    if (c && !online()) c.textContent = (c.textContent || '').replace(/ · PC offline.*/, '') + ' · PC offline, taps will run when it’s back';
  }

  // phone calendar edits: queued for the PC (inbox_act id cal:*), shown at once by patching the synced week until the PC pushes the real one
  const pendCal = [];
  const hm = s => s.slice(11, 16), dayOf = s => s.slice(0, 10);
  function overlay(w) {
    const now = Date.now(); while (pendCal.length && now - pendCal[0].at > 120000) pendCal.shift();
    if (!pendCal.length) return w;
    w = JSON.parse(JSON.stringify(w));
    for (const p of pendCal) {
      const j = p.j; let base = null;
      if (j.id) for (const d of w.days) for (const k of ['events', 'allday']) {
        const i = d[k].findIndex(e => e.id === j.id);
        if (i >= 0) { base = base || d[k][i]; d[k].splice(i, 1); }
      }
      if (j.op === 'delete') continue;
      const cal = (w.calendars || []).find(c => c.id === (j.cal_id || (base && base.cal_id))) || {};
      const e = {...(base || {}), id: j.id || 'tmp:' + p.at, title: j.title != null ? j.title : (base ? base.title : ''), where: j.where != null ? j.where : (base ? base.where : ''), cal_id: j.cal_id || (base && base.cal_id), cal: cal.name || (base && base.cal) || '', color: cal.color || (base && base.color) || '#7fd4e0', writable: true};
      if (!j.start) continue;
      if (j.all_day) {
        for (const d of w.days) if (d.date >= j.start.slice(0, 10) && d.date <= (j.end || j.start).slice(0, 10))
          d.allday.push({...e, first: d.date === j.start.slice(0, 10), last: d.date === (j.end || j.start).slice(0, 10), start: '00:00', end: '23:59', orig_all: true, rs: j.start.slice(0, 10) + 'T00:00:00', re: (j.end || j.start).slice(0, 10) + 'T00:00:00'});
      } else {
        const d = w.days.find(d => d.date === dayOf(j.start));
        if (d && !d.events.some(x => x.id === e.id)) d.events.push({...e, start: hm(j.start), end: hm(j.end), rs: j.start, re: j.end});
        if (d) d.events.sort((a, b) => a.start.localeCompare(b.start));
      }
    }
    return w;
  }

  // to-do taps: show the result at once (the PC's push can take a minute); remembered for 4 min, in localStorage so a reload keeps it
  const TP = 'os.todo.pend';
  const todoPend = () => { try { const o = JSON.parse(store.getItem(TP) || '{}'), n = Date.now(); for (const h in o) if (n - o[h].at > 240000) delete o[h]; return o; } catch (e) { return {}; } };
  const todoSet = (h, a) => { try { const o = todoPend(); o[h] = {a, at: Date.now()}; store.setItem(TP, JSON.stringify(o)); } catch (e) {} };
  // intake taps on the phone: counted at once, until the PC's pushed snapshot (intake.at) is newer than the tap
  const IP = 'os.intake.pend';
  const intakePend = () => { try { return JSON.parse(store.getItem(IP) || '[]').filter(p => Date.now() - p.at < 10 * 60000); } catch (e) { return []; } };
  const intakeSet = (k, d) => { try { store.setItem(IP, JSON.stringify([...intakePend(), {k, d, at: Date.now()}])); } catch (e) {} };
  function intakeOverlay(t) {
    if (!t || !t.intake) return t;
    const I = {...t.intake};
    for (const p of intakePend()) {
      if (p.at <= (I.at || 0)) continue;
      if (p.k === 'zyn') I.zyn = Math.max(0, I.zyn + p.d);
      if (p.k === 'can') { I.cans = Math.max(0, I.cans + p.d); I.caffeine_mg = I.cans * I.can_mg; }
      if (p.k === 'water') { I.water_fills = Math.max(0, I.water_fills + p.d); I.water_oz = I.water_fills * I.fill_oz; }
    }
    return {...t, intake: I};
  }
  function todoOverlay(t) {
    const o = todoPend(); if (!t || !t.todo || !Object.keys(o).length) return t;
    const todo = [];
    for (const x of t.todo) { const p = o[x.h]; if (!p) { todo.push(x); continue; } if (p.a === 'done') continue; todo.push(p.a === 'later' ? {...x, status: 'later'} : p.a === 'reopen' ? {...x, status: 'new'} : x); }
    return {...t, todo};
  }

  async function send(body) {
    await pull();
    const k = getKey(); if (!k) return {ok: false, msg: 'No key'};
    const r = await rf('/api/focus', {method: 'POST', headers: {'x-key': k, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    ver = ''; last = 0;
    if (r.status === 401) { try { store.removeItem(KEY); } catch (e) {} }
    return {ok: r.ok, status: r.status};
  }

  // iPhone home-screen apps keep the old page alive for days: when the app comes back to the front, check the deployed build and reload if it changed
  const BUILD = '8a800a1668';
  let checked = 0;
  async function fresh() {
    if (document.hidden || Date.now() - checked < 60000) return; checked = Date.now();
    try { const t = await (await rf(location.pathname + '?b=' + Date.now(), {cache: 'no-store'})).text(); const m = t.match(/const BUILD = '(\w+)'/); if (m && m[1] !== BUILD) location.reload(); } catch (e) {}
  }
  document.addEventListener('visibilitychange', fresh); setInterval(fresh, 10 * 60000);

  window.fetch = async (u, o) => {
    const url = String(u);
    if (!url.startsWith('/api/') || url.startsWith('/api/focus')) return rf(u, o);
    const path = url.split('?')[0], post = o && o.method === 'POST';
    try {
      if (!post && path === '/api/os') {
        await pull();
        if (!snap) return resp({error: 'no data'}, 503);
        const pend = new Set(snap.pending || []), os0 = snap.os || {items: [], log: []};
        const os = {...os0, items: (os0.items || []).filter(i => !pend.has('act:' + i.id))};   // tapped on the phone, PC hasn't run it yet
        setTimeout(() => patch(os.items), 60);
        return resp(os);
      }
      if (!post && path === '/api/today') { await pull(); return snap ? resp(intakeOverlay(todoOverlay(snap))) : resp({error: 'no data'}, 503); }
      if (!post && path === '/api/brief') { await pull(); const b = snap && snap.os && snap.os.brief; return b ? resp(b) : resp({error: 'no brief yet'}, 503); }
      if (!post && path === '/api/calendar') {
        await pull();
        const cal = snap && snap.os && snap.os.cal;   // the PC pushes 8 weeks (2 back, 5 ahead) as one strip
        return cal && cal.days ? resp(overlay({...cal, today: new Date().toLocaleDateString('en-CA')})) : resp({error: online() ? 'Calendar is on its way from your PC (it syncs every 15 s). Reopen this tab in a minute.' : 'No calendar on the phone yet: your PC is offline or asleep. It syncs within 15 s of the PC waking up with Theo OS running.'}, 404);
      }
      if (!post && path === '/api/money') { await pull(); return resp((snap && snap.money) || {}); }
      if (post && /^\/api\/cal\/(create|update|delete)$/.test(path)) {
        const j = {op: path.split('/').pop(), ...JSON.parse(o.body || '{}')};
        const r = await send({event: 'inbox_act', id: 'cal:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), action: 'send', body: JSON.stringify(j)});
        if (r.ok) pendCal.push({at: Date.now(), j});
        return resp({ok: r.ok, msg: r.ok ? (online() ? 'Saved. Syncing to Google in ~15 s' : 'PC offline, will sync when it’s back') : 'Failed (' + r.status + ')'}, r.ok ? 200 : 409);
      }
      if (post && path === '/api/capture') {
        const j = JSON.parse(o.body || '{}');
        const r = await send({event: 'capture', text: j.text, cid: Date.now().toString(36) + Math.random().toString(36).slice(2, 7)});
        return resp({ok: r.ok, to: r.ok ? [online() ? 'Daily note (about 15 s)' : 'queued, PC offline'] : null}, r.ok ? 200 : 400);
      }
      if (post && path === '/api/intake') {
        const j = JSON.parse(o.body || '{}'), d = j.delta === -1 ? -1 : 1;
        const r = await send({event: 'inbox_act', id: ['intake', j.kind, d, Date.now().toString(36)].join(':'), action: 'send'});
        if (r.ok) intakeSet(j.kind, d);
        return resp({ok: r.ok, msg: r.ok ? '' : 'Failed (' + r.status + ')'}, r.ok ? 200 : 409);
      }
      if (post && path === '/api/todo/act') {   // the site only queues inbox_act, so to-do taps ride it as id todo:<action>:<row>:<nonce>
        const j = JSON.parse(o.body || '{}');
        const r = await send({event: 'inbox_act', id: ['todo', j.action, j.h, Date.now().toString(36)].join(':'), action: 'send'});
        if (r.ok) todoSet(j.h, j.action);
        return resp({ok: r.ok, msg: r.ok ? (online() ? 'Done on your PC in ~15 s' : 'PC offline, will run when it’s back') : 'Failed (' + r.status + ')'}, r.ok ? 200 : 409);
      }
      if (post && path === '/api/inbox/act') {
        const j = JSON.parse(o.body || '{}');
        const r = await send({event: 'inbox_act', id: j.id, action: j.action, body: j.body});
        return resp({ok: r.ok, msg: r.ok ? (online() ? 'Sent to your PC' : 'PC offline, will run when it’s back') : 'Failed (' + r.status + ')'}, r.ok ? 200 : 409);
      }
    } catch (e) { return resp({error: String(e.message || e)}, 503); }
    return resp({error: 'not available on the hosted page'}, 404);
  };
})();

</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hm = min => Math.floor(min / 60) + ':' + pad(Math.round(min % 60));
const usd = (n, d = 0) => '$' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const clock = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDay = ms => new Date(ms).toLocaleDateString('en-US', {weekday: 'short', day: 'numeric', month: 'short'});
const dayLabel = ms => { const d = new Date(ms - 4 * 36e5), t = new Date(Date.now() - 4 * 36e5);
  return d.toDateString() === t.toDateString() ? 'Today · ' + fmtDay(ms) : fmtDay(ms); };
const VIEWS = ['today', 'health', 'inbox', 'cal', 'chat', 'log'];
const KC = {EMAIL: 'var(--peach)', CAPTURE: 'var(--k-school)', MONEY: 'var(--k-meal)', DUE: 'var(--bad)'};
const GONE = (() => { try { return JSON.parse(localStorage.getItem('os.gone') || '{}'); } catch (e) { return {}; } })();   // card id -> when Theo tapped it
function gone(id) { if (id) GONE[id] = Date.now(); for (const k in GONE) if (Date.now() - GONE[k] > 4 * 60000) delete GONE[k]; try { localStorage.setItem('os.gone', JSON.stringify(GONE)); } catch (e) {} }
const S = {os: {items: [], log: []}, today: null, money: null, brief: null, filter: 'all', shown: null, busy: false, ok: false};
async function jget(u) { const r = await fetch(u, {cache: 'no-store'}); if (!r.ok) { let m = ''; try { m = (await r.json()).error || ''; } catch (e) {} throw Object.assign(new Error(m || u + ' ' + r.status), {why: m}); } return r.json(); }
async function jpost(u, b) { const r = await fetch(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)}); let j = {}; try { j = await r.json(); } catch (e) {} return {...j, ok: r.ok}; }

/* ---- tabs ---- */
function show(v) {
  if (!VIEWS.includes(v)) v = 'today';
  for (const s of document.querySelectorAll('.view')) s.hidden = s.id !== 'v-' + v;
  for (const b of document.querySelectorAll('.bar button')) b.dataset.v === v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  const cur = document.querySelector('.bar button[aria-current]'), lens = document.querySelector('.bar .lens');
  if (cur && lens) { lens.style.width = cur.offsetWidth - 6 + 'px'; lens.style.transform = 'translateX(' + (cur.offsetLeft + 3) + 'px)'; cur.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'}); }
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
  document.body.classList.toggle('calv', v === 'cal');
  scrollTo(0, 0);
  if (v === 'chat') pollChat();
  if (v === 'cal') loadCal();
  if (v === 'health') renderHealth();
}
window.addEventListener('resize', () => show(location.hash.slice(1)));
document.querySelector('.bar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.v === 'cal' && b.getAttribute('aria-current') === 'page') return calToday(true); show(b.dataset.v); });   // tap Calendar again = jump to today
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
let tt;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
function ago(ms) { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; }
/* ---- inbox: one card at a time ---- */
function renderInbox() {
  const items = S.os.items, q = items[0], left = items.length, st = $('stage');
  $('badge').textContent = left; $('badge').hidden = !left;
  $('in-sub').textContent = left ? left + ' need you' : 'clear';
  $('qpos').textContent = left ? 'Item 1 of ' + left : 'All done';
  $('qdots').innerHTML = items.slice(0, 12).map((_, i) => '<i class="' + (i === 0 ? 'on' : '') + '"></i>').join('');
  if (!q) { S.shown = null; st.innerHTML = '<div class="empty"><b>Inbox clear</b><p>Nothing needs you. Cards arrive as Claude finds them.</p></div>'; $('next').innerHTML = ''; return; }
  if (S.shown !== q.id) {   // never wipe a draft Theo is editing when the 5 s refresh lands
    S.shown = q.id;
    st.innerHTML = '<article class="card" id="card" aria-live="polite">'
      + '<div class="ch"><div class="top"><span class="kind" style="--c:' + (KC[q.kind] || 'var(--ink-3)') + '">' + esc(q.kind) + '</span><span class="age">' + ago(q.created) + '</span></div>'
      + '<h2>' + esc(q.title) + '</h2><p class="why">' + esc(q.why) + '</p></div>'
      + '<dl class="meta">' + q.meta.filter(m => m[1]).map(m => '<dt>' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd>').join('') + '</dl>'
      + (q.orig ? '<div class="orig">' + esc(q.orig) + '</div>' : '')
      + '<div class="edl"><span class="lbl">' + (q.kind === 'EMAIL' ? 'Draft' : 'Proposed') + '</span><span class="lbl">Editable</span></div>'
      + '<textarea class="body" id="body" spellcheck="true" aria-label="Editable body">' + esc(q.body) + '</textarea>'
      + '<div class="acts"><button type="button" class="skip" id="skip">Skip</button><button type="button" class="send" id="send">' + esc(q.label) + '</button></div>'
      + '<p class="safe">' + esc(q.safe) + '</p></article>';
    const ta = $('body'); ta.style.height = 'auto'; ta.style.height = Math.max(90, ta.scrollHeight + 4) + 'px';
    $('send').onclick = () => resolve(q, 'send'); $('skip').onclick = () => resolve(q, 'skip');
  }
  $('next').innerHTML = items.length > 1 ? '<div class="lbl" style="margin-bottom:4px">Up next</div>' + items.slice(1, 6).map(n => '<div class="row"><span class="tx">' + esc(n.title) + '</span><span class="vl">' + esc(n.kind.toLowerCase()) + '</span></div>').join('') : '';
}
async function resolve(q, action) {
  if (S.busy) return; S.busy = true;
  $('send').disabled = $('skip').disabled = true;
  const r = await jpost('/api/inbox/act', {id: q.id, action: action, body: action === 'send' ? $('body').value : undefined});
  if (r.ok || /already handled/.test(r.msg || '')) {
    gone(q.id);
    $('card').classList.add(action === 'send' ? 'out' : 'skip'); toast(r.ok ? r.msg : 'Already done');
    await new Promise(x => setTimeout(x, 230));
    S.os.items = S.os.items.filter(i => i.id !== q.id); S.shown = null;
  } else { toast(r.msg || 'Failed. Is Theo OS running?'); $('send').disabled = $('skip').disabled = false; }
  S.busy = false; await pollOs();
}
/* ---- log ---- */
function renderLog() {
  const list = S.os.log.filter(e => S.filter === 'all' || e.k === S.filter);
  $('lg-sub').textContent = list.length + ' entries';
  const C = {cap: 'var(--k-school)', out: 'var(--good)', skip: 'var(--ink-3)', sys: 'var(--ink-3)'};
  let out = '', day = null;
  list.forEach((e, i) => {
    const d = dayLabel(e.at);
    if (d !== day) { day = d; out += '<div class="dayh lbl">' + esc(d) + '</div><div class="feed">'; }
    out += '<div class="ev" style="--c:' + (C[e.k] || 'var(--ink-3)') + '"><span class="tm">' + clock(e.at) + '</span><div><div class="tx">' + esc(e.tx) + '</div>'
      + '<div class="to"><span class="pill">' + esc(e.src) + '</span>' + (e.to && e.to.length ? '<span class="arrow">→</span>' + e.to.map(n => '<span class="note-l">' + esc(n) + '</span>').join('') : '') + '</div></div></div>';
    if (!list[i + 1] || dayLabel(list[i + 1].at) !== day) out += '</div>';
  });
  $('feed').innerHTML = out || '<p class="lbl" style="padding:20px 2px">Nothing here yet. Type something in the capture bar.</p>';
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; S.filter = b.dataset.f;
  for (const x of $('chips').children) x.setAttribute('aria-pressed', x === b);
  renderLog();
});

/* ---- capture ---- */

/* ---- chat: Claude via gate.py /api/chat (reply takes 5-60 s; poll while busy) ---- */
const CH = {topic: (() => { try { return localStorage.getItem('os.chat.topic') || 'general'; } catch (e) { return 'general'; } })(), st: null, waiting: false, timer: null, n: -1};
function renderChat() {
  const st = CH.st; if (!st) return;
  if ($('topics').children.length !== st.topics.length)
    $('topics').innerHTML = st.topics.map(t => '<button type="button" data-t="' + esc(t.id) + '">' + esc(t.label) + '</button>').join('');
  for (const b of $('topics').children) b.setAttribute('aria-pressed', b.dataset.t === CH.topic);
  const label = (st.topics.find(t => t.id === CH.topic) || {}).label || '';
  $('ch-sub').textContent = label;
  const busy = st.busy || CH.waiting;
  let h = st.messages.map(m => '<div class="msg ' + m.role + '">' + esc(m.text)
    + (m.actions ? '<small class="cards">' + m.actions + ' suggestion' + (m.actions > 1 ? 's' : '') + ' sent to your Inbox</small>' : '') + '</div>').join('');
  if (busy) h += '<div class="msg think">thinking</div>';
  else if (st.error) h += '<div class="msg err">Claude failed: ' + esc(st.error) + '</div>';
  if (!st.messages.length && !busy) h = '<div class="empty"><b>' + esc(label) + '</b><p>Ask anything. Claude reads your vault first. It can suggest actions, only your taps act.</p></div>';
  const changed = st.messages.length !== CH.n || busy;
  $('msgs').innerHTML = h;
  if (changed) { scrollTo(0, document.body.scrollHeight); CH.n = st.messages.length; }
  $('chatb').disabled = busy || !$('chati').value.trim();
}
async function pollChat() {
  clearTimeout(CH.timer);
  const th = CH.topic;
  try { const s = await jget('/api/chat?thread=' + encodeURIComponent(th)); if (th !== CH.topic) return; CH.st = s; if (!s.busy) CH.waiting = false; } catch (e) {}
  renderChat();
  if (CH.st && (CH.st.busy || CH.waiting)) CH.timer = setTimeout(pollChat, 1500);
  else pollOs();   // a reply may have made Inbox cards
}

/* Spending you chose: drops Bills + Savings (rent via Dad, savings moves). */
function moneyOut(M) {
  const own = c => c.group !== 'Bills' && c.group !== 'Savings';
  const cats = (M.categories || []).filter(c => own(c) && c.budgeted > 0);
  const dl = Math.max(1, (M.days_in_month || 30) - (M.day || 1) + 1);
  // spendable pool = what's still unspent in each Wants/Needs envelope (capped at its budget: a refund shouldn't read as free money)
  const pool = cats.reduce((a, c) => a + Math.min(Math.max(0, c.left), c.budgeted), 0);
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const rows = (M.recent || []).filter(r => r.amt > 0 && cats.some(c => c.name === r.cat));
  const today = rows.filter(r => r.date === iso(new Date())).reduce((a, r) => a + r.amt, 0);
  return {cats, pool, perDay: pool / dl, dl, today};
}

/* ---- to-do taps: done / later / now -> gate.py edits the Errands Queue row ---- */
async function todoAct(h, a) {
  const r = await jpost('/api/todo/act', {h, action: a});
  if (!r.ok) toast(r.msg || 'Failed. Is Theo OS running?');
  else if (a === 'done') {
    const t = $('toast'); t.innerHTML = esc(r.msg || 'Deleted') + '<button type="button">Undo</button>'; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 6000);
    t.querySelector('button').onclick = () => { t.classList.remove('show'); todoAct(h, 'reopen'); };
  } else toast(r.msg);
  if (r.ok && !LOCAL) setTimeout(pollToday, 1200);
  setTimeout(pollToday, r.ok && !LOCAL ? 20000 : 300);
  return r.ok;
}

/* ---- CALENDAR: one continuous strip of days (2 weeks back, 5 ahead). 3 columns on a phone, 7 on a PC. Scroll sideways through time. ---- */
const CAL = {start: null, ev: {}, n: 0, api: false, cals: [], today: '', data: null, sig: ''};
const H0 = 7, H1 = 23; let PX = 48;
const GUT = 40, colW = () => innerWidth < 620 ? (innerWidth - 24 - GUT - 2) / 3 : innerWidth < 900 ? (innerWidth - 24 - GUT - 2) / 5 : Math.max(96, (innerWidth - 138 - GUT - 4) / 7);

function renderCal(c, keep) {

  const reg = (e, d) => { const k = 'k' + (CAL.n++); CAL.ev[k] = {...e, date: d.date}; return k; };
  const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const t7 = new Date(new Date(c.today + 'T00:00').getTime() + 7 * 864e5).toLocaleDateString('en-CA');
  $('cal-due').innerHTML = c.days.filter(d => d.date >= c.today && d.date <= t7).flatMap(d => d.due.map(x => '<span>' + esc(d.dow) + ' · ' + esc(x.replace(/\s*\(\d{4}-\d\d-\d\d\)/, '').slice(0, 60)) + '</span>')).join('');
  const lay = evs => {   // side-by-side columns for overlapping events (Google Calendar style)
    const L = evs.map(e => ({e, a: mins(e.start), b: Math.max(mins(e.end), mins(e.start) + 30), col: 0, n: 1})).sort((x, y) => x.a - y.a || y.b - x.b), groups = []; let cur = null;
    for (const x of L) { if (!cur || x.a >= cur.end) { cur = {end: 0, items: []}; groups.push(cur); } const used = new Set(cur.items.filter(y => y.b > x.a).map(y => y.col)); while (used.has(x.col)) x.col++; cur.items.push(x); cur.end = Math.max(cur.end, x.b); }
    for (const g of groups) { const n = Math.max(...g.items.map(x => x.col)) + 1; g.items.forEach(x => x.n = n); }
    return L;
  };
  const MON = d => new Date(d + 'T00:00').toLocaleDateString('en-US', {month: 'short'});
  let head = '<div></div>', body = '<div class="hrs">' + Array.from({length: H1 - H0}, (_, i) => '<div>' + (H0 + i > 12 ? H0 + i - 12 : H0 + i) + (H0 + i >= 12 ? 'p' : 'a') + '</div>').join('') + '</div>', ad = '<div></div>';
  c.days.forEach((d, i) => {
    const isT = d.date === c.today, dn = new Date(d.date + 'T00:00').getDate(), m1 = dn === 1;
    head += '<div class="' + (isT ? 'today' : '') + (m1 ? ' m1' : '') + '">' + esc(d.dow) + (m1 || i === 0 ? ' · ' + MON(d.date) : '') + '<b>' + dn + '</b></div>';

    }).join('') + (isT ? '<div class="nowl" id="nowl"></div>' : '') + '</div>';

/* today's 24 hours as a heat strip */
function heatStrip(T) {
  const sh = (T.timeline && T.timeline.start_hour) || 4, sc = {}; (T.categories || []).forEach(c => { sc[c.name] = c.score; });
  const hrs = ((T.timeline && T.timeline.hours) || []).map(h => Object.entries(h || {}).reduce((a, [k, v]) => a + (sc[k] > 0 ? v : 0), 0) / 60);
  const cur = ((new Date().getHours() - sh) + 24) % 24, mx = Math.max(15, ...hrs);
  return '<div class="heat">' + hrs.map((v, i) => '<i style="--a:' + (i > cur ? 0 : Math.min(1, v / mx)).toFixed(2) + '" title="' + pad((i + sh) % 24) + ':00 · ' + Math.round(v) + ' min"></i>').join('') + '</div>'
    + '<div class="clab"><span>' + pad(sh) + ':00</span><span>' + pad((sh + 6) % 24) + '</span><span>' + pad((sh + 12) % 24) + '</span><span>' + pad((sh + 18) % 24) + '</span><span>' + pad(sh) + ':00</span></div>';
}
const stackBar = parts => { const tot = parts.reduce((a, p) => a + p.v, 0) || 1; return '<div class="stg tall">' + parts.map(p => '<i style="--f:' + p.v + ';--c:' + p.c + '" title="' + esc(p.n) + '"></i>').join('') + '</div><div class="legend">' + parts.map(p => '<span><i style="--c:' + p.c + '"></i>' + esc(p.n) + ' ' + Math.round(p.v / tot * 100) + '%</span>').join('') + '</div>'; };
const hp = (cls, title, right, body) => '<article class="w hp ' + cls + '"><div class="wt"><span>' + title + '</span><span class="r">' + (right || '') + '</span></div>' + body + '</article>';
const kv = (l, v) => '<div class="kv"><span>' + l + '</span><b>' + v + '</b></div>';

function renderHealth() {
  const T = S.today; if (!T) return;
  const L = T.life || {}, lt = L.today || {}, g = L.garmin || {}, sl = L.sleep || {}, st = sl.stages || {};
  const D = ((L.health && L.health.days) || []).slice(-30), lab = D.map(d => hday(d.date).slice(0, 1)), n7 = D.slice(-14);
  const sleepers = D.map(d => d.sleep_s ? d.sleep_s / 3600 : null), avg = a => { const x = a.filter(v => v != null); return x.length ? x.reduce((p, q) => p + q, 0) / x.length : 0; };
  const bed = D.map(d => d.start ? ((T0(d.start) + 360) % 1440) / 60 : null), wake = D.map(d => d.end ? T0(d.end) / 60 : null);   // bed hours after 18:00
  const clk = h => pad(Math.floor(((h * 60 + 1080) % 1440) / 60)) + ':' + pad(Math.round((h * 60) % 60));
  const out = [];
  out.push(hp('sleep half', 'Last night', lt.sleep ? 'score ' + lt.sleep : '',
    '<div class="hbig">' + (lt.sleep_min ? hm(lt.sleep_min) : '–') + '<small>hours asleep</small></div>' + hypno(sl.levels)
    + (lt.sleep_min ? stackBar([{n: 'deep', v: st.deep || 0, c: '#5b3df5'}, {n: 'light', v: st.light || 0, c: '#ffc2dc'}, {n: 'rem', v: st.rem || 0, c: '#fff'}, {n: 'awake', v: st.awake || 0, c: '#ff6b5e'}]) : '')
    + '<div class="kvs">' + kv('Resting HR', g.rhr || '–') + kv('Breathing', g.resp ? g.resp + '/min' : '–') + kv('Battery gained', g.bb_sleep != null ? '+' + g.bb_sleep : '–') + kv('Stress asleep', g.stress != null ? g.stress : '–') + '</div>'));
  out.push(hp('sleep half', 'Sleep, 30 nights', 'avg ' + avg(sleepers).toFixed(1) + ' h',
    '<p class="sub" style="font-size:13px;margin:8px 0 6px">' + barLabel(sleepers) + '</p>' + barChart(sleepers.map(v => v || 0), lab, {goal: 8, max: 10})
    + '<p class="hl">Bedtime and wake-up per night (' + bed.filter(v => v != null).length + ' of ' + D.length + ' nights have times). Flatter lines = steadier sleep.</p>'
    + '<div class="two2"><div><span class="hl">Bedtime ' + (bed.filter(Boolean).length ? 'avg ' + clk(avg(bed)) : '') + '</span>' + lineChart(bed, {h: 80, area: false, fmt: clk}) + '</div><div><span class="hl">Wake-up ' + (wake.filter(Boolean).length ? 'avg ' + pad(Math.floor(avg(wake))) + ':' + pad(Math.round(avg(wake) % 1 * 60)) : '') + '</span>' + lineChart(wake, {h: 80, area: false, fmt: v => pad(Math.floor(v)) + ':' + pad(Math.round(v % 1 * 60) % 60)}) + '</div></div>'));
  const wk = T.week || [];
  out.push(hp('focus half', 'Focus today', hm(T.productive_min) + ' / ' + hm(T.goal_min),
    '<div class="hbig">' + (T.unlocked ? 'unlocked' : hm(Math.max(0, T.goal_min - T.productive_min)) + '<small>to go</small>') + '</div>' + heatStrip(T)
    + stackBar((T.categories || []).filter(c => c.sec > 60).slice(0, 6).map((c, i) => ({n: c.name.split(' > ').pop(), v: c.sec, c: c.color || '#fff'})))
    + '<div class="kvs">' + kv('Focused', hm(T.productive_min)) + kv('Distracted', hm(T.distracting_min || 0)) + kv('Total', hm(T.total_min || 0)) + '</div>'));
  out.push(hp('focus half', 'Focus, this week', 'goal ' + hm(T.goal_min),
    barChart(wk.map(d => d.productive_min), wk.map(d => d.dow.slice(0, 2)), {goal: T.goal_min, h: 120})
    + '<p class="hl">Life score per day</p>' + lineChart(wk.map(d => d.life), {h: 70, min: 0, max: 100})));
  const todayIso = new Date().toLocaleDateString('en-CA'), stepsV = D.map(d => d.date === todayIso ? null : (d.steps || null));   // today is still in progress
  out.push(hp('body half', 'Steps, 30 days', 'today ' + (g.steps || 0).toLocaleString(),
    '<div class="hbig">' + Math.round(avg(stepsV)).toLocaleString() + '<small>daily average</small></div>' + lineChart(stepsV, {h: 110, goal: g.step_goal || 7000, min: 0, fmt: v => Math.round(v / 1000) + 'k'}) + '<p class="hl">Dashed line = goal. Today is left out until the day is over.</p>'
    + '<div class="kvs">' + kv('Goal', (g.step_goal || 0).toLocaleString()) + kv('Walked today ≈', ((g.steps || 0) * .00075).toFixed(1) + ' km') + kv('Active kcal', Math.round(g.active_kcal || 0)) + '</div>'));
  out.push(hp('body half', 'Body battery & heart', g.bb != null ? 'now ' + g.bb : '',
    rangeChart(D.map(d => d.bb_low), D.map(d => d.bb_high), lab)
    + '<p class="hl">Resting heart rate</p>' + lineChart(D.map(d => d.rhr || null), {h: 70})
    + '<p class="hl">Stress (daily average)</p>' + lineChart(D.map(d => d.stress != null ? d.stress : null), {h: 60, min: 0})));
  $('hgrid').innerHTML = out.join('');
}
function barLabel(v) { const x = v.filter(a => a != null); return x.length ? x[x.length - 1].toFixed(1) + ' h last night · ' + x.filter(a => a >= 7).length + '/' + x.length + ' nights over 7 h' : '–'; }

pollOs(); pollToday(); pollBrief();
setInterval(pollOs, 5000); setInterval(pollToday, 30000); setInterval(pollBrief, 10 * 60000);
show(location.hash.slice(1));
</script>
